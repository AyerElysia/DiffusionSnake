<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1350" viewBox="0 0 2200 1350" role="img" aria-labelledby="title desc">
  <title id="title">DiffusionSnake V5.2 training architecture and loss design</title>
  <desc id="desc">V5.2 training graph with EfficientSAM initialization, SAMSnake coarse refinement, V4.1-FM refinement, and active loss terms.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.2; rx: 18; }
      .panel-blue { fill: #f1f7ff; stroke: #2563eb; stroke-width: 2.3; rx: 18; }
      .panel-teal { fill: #effaf7; stroke: #0f766e; stroke-width: 2.3; rx: 18; }
      .panel-purple { fill: #f7f2ff; stroke: #6d28d9; stroke-width: 2.3; rx: 18; }
      .panel-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.3; rx: 18; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.8; rx: 12; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; rx: 12; }
      .box-teal { fill: #ecfdf5; stroke: #0f766e; stroke-width: 1.8; rx: 12; }
      .box-purple { fill: #faf5ff; stroke: #7c3aed; stroke-width: 1.8; rx: 12; }
      .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; rx: 12; }
      .box-red { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.8; rx: 12; }
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 46px; font-weight: 800; fill: #111827; }
      .subtitle { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 22px; fill: #475569; }
      .h2 { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #0f172a; }
      .h3 { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #1e293b; }
      .txt { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 19px; fill: #334155; }
      .small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 16px; fill: #64748b; }
      .tiny { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .formula { font-family: "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 19px; fill: #1e293b; }
      .formula-big { font-family: "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .badge { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; rx: 12; }
      .badge-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; rx: 12; }
      .badge-red { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.2; rx: 12; }
      .arrow { stroke: #2563eb; stroke-width: 3.2; fill: none; marker-end: url(#arrow-blue); }
      .arrow-teal { stroke: #0f766e; stroke-width: 3.2; fill: none; marker-end: url(#arrow-teal); }
      .arrow-purple { stroke: #6d28d9; stroke-width: 3.2; fill: none; marker-end: url(#arrow-purple); }
      .arrow-orange { stroke: #ea580c; stroke-width: 3.2; fill: none; marker-end: url(#arrow-orange); }
      .grad { stroke: #e11d48; stroke-width: 3.4; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrow-red); }
      .stop { stroke: #64748b; stroke-width: 3.2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow-gray); }
      .thin { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .train { fill: #16a34a; }
      .nograd { fill: #e11d48; }
      .blue { fill: #2563eb; }
      .teal { fill: #0f766e; }
      .purple { fill: #6d28d9; }
      .orange { fill: #ea580c; }
      .gray { fill: #64748b; }
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#6d28d9"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#e11d48"/></marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="2200" height="1350"/>
  <text class="title" x="70" y="64">DiffusionSnake V5.2: Training Architecture + Loss Design</text>
  <text class="subtitle" x="72" y="100">Current config: GT bbox -> EfficientSAM -> SAMSnake coarse refine -> V4.1-FM. Red dashed arrows show gradient flow.</text>

  <!-- Column headers -->
  <text class="h2" x="75" y="150">1. Inputs</text>
  <text class="h2" x="340" y="150">2. Frozen initialization</text>
  <text class="h2" x="725" y="150">3. Trainable coarse refine</text>
  <text class="h2" x="1138" y="150">4. Trainable V4.1-FM refine</text>
  <text class="h2" x="1755" y="150">5. Output</text>

  <!-- Inputs panel -->
  <rect class="panel-blue" x="45" y="170" width="245" height="690"/>
  <rect class="box" x="70" y="205" width="195" height="118"/>
  <text class="h3" x="118" y="238">Image</text>
  <rect x="115" y="258" width="90" height="48" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/>
  <path class="thin" d="M145 258 V306 M175 258 V306 M115 282 H205"/>

  <rect class="box" x="70" y="350" width="195" height="124"/>
  <text class="h3" x="98" y="382">GT bbox prompt</text>
  <text class="small" x="108" y="407">use_gt_det: true</text>
  <rect x="113" y="424" width="108" height="34" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="7 5"/>

  <rect class="box" x="70" y="502" width="195" height="124"/>
  <text class="h3" x="92" y="534">GT contour target</text>
  <path d="M116 586 C120 542, 184 545, 198 577 C217 619, 119 622, 116 586" fill="#f1f5f9" stroke="#2563eb" stroke-width="3"/>
  <circle cx="116" cy="586" r="4" class="blue"/><circle cx="198" cy="577" r="4" class="blue"/><circle cx="165" cy="544" r="4" class="blue"/>

  <rect class="box" x="70" y="654" width="195" height="124"/>
  <text class="h3" x="112" y="688">Flow time t</text>
  <circle cx="165" cy="732" r="38" fill="#faf5ff" stroke="#6d28d9" stroke-width="4"/>
  <path d="M165 704 V733 L188 756" stroke="#6d28d9" stroke-width="4" fill="none"/>

  <rect class="badge-green" x="82" y="805" width="170" height="34"/>
  <circle cx="103" cy="822" r="7" class="train"/>
  <text class="small" x="119" y="828">GT supervision</text>

  <!-- EfficientSAM panel -->
  <rect class="panel-teal" x="325" y="170" width="345" height="690"/>
  <rect class="badge-red" x="358" y="187" width="190" height="34"/>
  <circle cx="378" cy="204" r="7" class="nograd"/>
  <text class="small" x="394" y="210">no gradient</text>

  <rect class="box-teal" x="355" y="240" width="285" height="92"/>
  <text class="h3" x="388" y="274">GT bbox -> EfficientSAM</text>
  <text class="small" x="415" y="303">ViT-T, no_grad</text>

  <rect class="box-teal" x="355" y="365" width="285" height="92"/>
  <text class="h3" x="418" y="398">Mask prediction</text>
  <path d="M438 429 C446 391, 515 389, 546 420 C570 452, 436 468, 438 429" fill="#0f172a"/>
  <path d="M515 403 C535 414, 535 442, 505 448" stroke="#ffffff" stroke-width="8" fill="none" opacity="0.75"/>

  <rect class="box-teal" x="355" y="490" width="285" height="92"/>
  <text class="h3" x="385" y="523">Area-based multimask</text>
  <text class="h3" x="455" y="550">select</text>

  <rect class="box-teal" x="355" y="615" width="285" height="118"/>
  <text class="h3" x="390" y="648">Mask -> 128-point</text>
  <text class="h3" x="435" y="675">contour</text>
  <path d="M425 704 C430 669, 520 670, 540 700 C554 735, 430 738, 425 704" fill="#e0f2fe" stroke="#0f766e" stroke-width="2.5"/>
  <path d="M452 706 C462 682, 521 684, 528 706 C535 729, 455 728, 452 706" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="4 5"/>

  <rect class="badge" x="377" y="770" width="238" height="38"/>
  <text class="small" x="405" y="795">Fallback: octagon if SAM fails</text>

  <!-- SAMSnake panel -->
  <rect class="panel-blue" x="705" y="170" width="370" height="690"/>
  <rect class="badge-green" x="735" y="187" width="215" height="34"/>
  <circle cx="755" cy="204" r="7" class="train"/>
  <text class="small" x="771" y="210">trainable by FM loss</text>

  <rect class="box-blue" x="735" y="240" width="310" height="105"/>
  <text class="h3" x="777" y="273">SAMSnake DLA features</text>
  <text class="small" x="793" y="303">detector_backend: samsnake_fm</text>
  <text class="small" x="795" y="325">ct_hm / wh heads present</text>

  <rect class="box-blue" x="735" y="375" width="310" height="126"/>
  <text class="h3" x="780" y="407">Coarse refine module</text>
  <text class="small" x="770" y="435">center + 128 contour points</text>
  <text class="small" x="785" y="460">point features -> MLP</text>
  <text class="small" x="790" y="485">zero-init refine head</text>

  <rect class="box-blue" x="735" y="530" width="310" height="118"/>
  <text class="h3" x="787" y="562">Coarse displacement</text>
  <text class="small" x="788" y="590">stride 4.0</text>
  <text class="small" x="788" y="615">max disp frac 0.20</text>
  <path d="M825 628 C857 606, 919 609, 944 635" stroke="#2563eb" stroke-width="3" fill="none"/>

  <rect class="box-blue" x="735" y="680" width="310" height="118"/>
  <text class="h3" x="775" y="713">Coarse refined contour</text>
  <path d="M818 762 C824 709, 967 707, 979 748 C995 805, 824 813, 818 762" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <path d="M818 762 C824 709, 967 707, 979 748 C995 805, 824 813, 818 762" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- V4.1 FM panel -->
  <rect class="panel-purple" x="1110" y="170" width="530" height="690"/>
  <rect class="badge-green" x="1140" y="187" width="235" height="34"/>
  <circle cx="1160" cy="204" r="7" class="train"/>
  <text class="small" x="1176" y="210">trainable denoiser</text>

  <rect class="box-purple" x="1140" y="240" width="210" height="112"/>
  <text class="h3" x="1168" y="272">Normal detail</text>
  <text class="h3" x="1188" y="300">context</text>
  <text class="small" x="1166" y="326">+r1, -r1, +r2, -r2</text>

  <rect class="box-purple" x="1390" y="240" width="220" height="112"/>
  <text class="h3" x="1424" y="272">Time embedding</text>
  <text class="small" x="1442" y="303">sinusoidal -> dim 256</text>
  <path d="M1424 327 C1440 292, 1455 362, 1470 327 S1500 292, 1516 327" stroke="#6d28d9" stroke-width="3" fill="none"/>

  <rect class="box-purple" x="1140" y="390" width="470" height="250"/>
  <text class="h3" x="1242" y="424">V4.1-FM denoiser</text>
  <text class="small" x="1230" y="451">V3.4 detail backbone, 6 DiT blocks, dim 256, 8 heads</text>
  <g>
    <rect x="1178" y="480" width="182" height="36" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="1390" y="480" width="182" height="36" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
    <rect x="1178" y="526" width="182" height="36" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="1390" y="526" width="182" height="36" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
    <rect x="1178" y="572" width="182" height="36" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="1390" y="572" width="182" height="36" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
    <text class="small" x="1242" y="503">Global</text>
    <text class="small" x="1450" y="503">Local</text>
    <text class="small" x="1242" y="549">Global</text>
    <text class="small" x="1450" y="549">Local</text>
    <text class="small" x="1242" y="595">Global</text>
    <text class="small" x="1450" y="595">Local</text>
  </g>

  <rect class="box-purple" x="1140" y="670" width="220" height="118"/>
  <text class="h3" x="1173" y="704">Final velocity head</text>
  <text class="small" x="1194" y="733">v_pred, shape (128,2)</text>

  <rect class="box-purple" x="1390" y="670" width="220" height="118"/>
  <text class="h3" x="1412" y="704">Per-point delta head</text>
  <text class="small" x="1432" y="733">scale 0.10</text>
  <text class="small" x="1432" y="758">L2 reg 0.0002</text>

  <rect class="badge" x="1180" y="810" width="380" height="34"/>
  <text class="small" x="1224" y="833">iterative fractions: 0.333, 0.5, 1.0</text>

  <!-- Output panel -->
  <rect class="panel-orange" x="1690" y="170" width="270" height="690"/>
  <rect class="box-orange" x="1720" y="245" width="210" height="100"/>
  <text class="h3" x="1762" y="282">Predicted flow</text>
  <text class="small" x="1781" y="313">x1_pred -> disp</text>

  <rect class="box-orange" x="1720" y="405" width="210" height="115"/>
  <text class="h3" x="1758" y="440">Clamp output</text>
  <text class="small" x="1742" y="470">FM max disp frac 0.25</text>

  <rect class="box-orange" x="1720" y="580" width="210" height="190"/>
  <text class="h3" x="1755" y="615">Final contour</text>
  <path d="M1768 714 C1772 634, 1892 636, 1898 695 C1905 768, 1766 786, 1768 714" fill="#fed7aa" opacity="0.35"/>
  <path d="M1768 714 C1772 634, 1892 636, 1898 695 C1905 768, 1766 786, 1768 714" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="1768" cy="714" r="4" class="blue"/><circle cx="1836" cy="635" r="4" class="blue"/><circle cx="1898" cy="695" r="4" class="blue"/>

  <rect class="badge-red" x="1730" y="805" width="190" height="34"/>
  <text class="small" x="1761" y="828">not detector output</text>

  <!-- Forward arrows top -->
  <path class="arrow" d="M265 264 H325"/>
  <path class="arrow" d="M265 412 H325"/>
  <path class="arrow-teal" d="M640 286 H705"/>
  <path class="arrow-teal" d="M640 670 C665 670, 675 735, 705 735"/>
  <path class="arrow" d="M1045 738 H1110"/>
  <path class="arrow-purple" d="M1640 725 H1690"/>
  <path class="arrow-orange" d="M1825 345 V405"/>
  <path class="arrow-orange" d="M1825 520 V580"/>
  <path class="arrow-purple" d="M265 716 C620 716, 730 820, 1110 820"/>
  <path class="arrow-teal" d="M265 566 C470 566, 575 1040, 640 1040"/>

  <!-- Loss panel -->
  <rect class="panel" x="45" y="925" width="2115" height="370"/>
  <text class="h2" x="80" y="975">6. Loss design: how V5.2 is trained</text>
  <text class="subtitle" x="80" y="1008">Only the trainable refinement path receives gradients. EfficientSAM and GT bbox are initialization / supervision sources.</text>

  <!-- Target construction -->
  <rect class="box-blue" x="80" y="1045" width="520" height="205"/>
  <text class="h3" x="110" y="1080">Target construction</text>
  <text class="formula" x="110" y="1120">x1 = normalize(GT contour - coarse contour)</text>
  <text class="formula" x="110" y="1155">x0 ~ noise,   x_t = (1-t) * x0 + t * x1</text>
  <text class="formula" x="110" y="1190">v_target = x1 - x0</text>
  <text class="txt" x="110" y="1225">Small-displacement training: prob 0.10;</text>
  <text class="txt" x="110" y="1248">init moved by 0.80-0.95 of GT residual.</text>

  <!-- Active losses -->
  <rect class="box-red" x="640" y="1045" width="680" height="205"/>
  <text class="h3" x="670" y="1080">Active loss terms</text>
  <text class="formula-big" x="670" y="1120">L_total = 0 * L_det + 1.0 * L_FM + L_delta_reg</text>
  <text class="formula" x="670" y="1155">L_FM = mean_p [ w_curv(p) * ||v_pred(p) - v_target(p)||^2 ]</text>
  <text class="formula" x="670" y="1190">w_curv(p) = 1 + 1.5 * curvature_norm(p)</text>
  <text class="formula" x="670" y="1225">L_delta_reg = 0.0002 * ||PerPointDeltaHead||^2</text>

  <!-- Inactive losses -->
  <rect class="box" x="1360" y="1045" width="360" height="205"/>
  <text class="h3" x="1390" y="1080">Disabled / no direct loss</text>
  <text class="txt" x="1390" y="1120">Detector loss: det weight = 0</text>
  <text class="txt" x="1390" y="1155">EfficientSAM loss: none</text>
  <text class="txt" x="1390" y="1190">Chamfer loss: not enabled in V5.2</text>
  <text class="txt" x="1390" y="1225">Smooth / curv regularizers: inactive unless configured</text>

  <!-- Backprop map -->
  <rect class="box-teal" x="1760" y="1045" width="360" height="205"/>
  <text class="h3" x="1790" y="1080">Gradient flow</text>
  <text class="txt" x="1790" y="1120">L_FM trains V4.1-FM denoiser</text>
  <text class="txt" x="1790" y="1155">L_FM also trains SAMSnake refine</text>
  <text class="txt" x="1790" y="1190">DLA features update through refine/F-M path</text>
  <text class="txt" x="1790" y="1225">No gradient into EfficientSAM</text>

  <!-- Backprop arrows -->
  <path class="grad" d="M1940 1045 C1810 930, 1580 850, 1495 790"/>
  <path class="grad" d="M1900 1045 C1570 940, 1100 900, 910 800"/>
  <path class="grad" d="M1820 1045 C1320 960, 900 905, 875 345"/>
  <path class="stop" d="M1735 1070 C1300 900, 640 900, 510 740"/>

  <!-- Legend -->
  <rect class="badge-green" x="75" y="1265" width="190" height="36"/>
  <circle cx="98" cy="1283" r="7" class="train"/>
  <text class="small" x="115" y="1289">trainable module</text>
  <rect class="badge-red" x="285" y="1265" width="190" height="36"/>
  <circle cx="308" cy="1283" r="7" class="nograd"/>
  <text class="small" x="325" y="1289">frozen / no-grad</text>
  <text class="small" x="510" y="1289">Red dashed arrows: backward path from loss.</text>
</svg>
