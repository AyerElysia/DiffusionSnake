<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">V4.3 相较于 V3.4-FM 的改进说明图</title>
  <desc id="desc">图中对比 V3.4-FM 与 V4.3 的结构变化和 BTCV 验证集指标变化。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d6dbe7; stroke-width: 2; rx: 18; }
      .panel2 { fill: #f0f6ff; stroke: #b6c8e6; stroke-width: 2; rx: 18; }
      .panel3 { fill: #edf8f5; stroke: #a7d0c3; stroke-width: 2; rx: 18; }
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #182235; }
      .subtitle { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 22px; fill: #5b667a; }
      .h2 { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #182235; }
      .h3 { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 23px; font-weight: 800; fill: #243047; }
      .txt { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 21px; fill: #334056; }
      .small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; fill: #667085; }
      .metric { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #243047; }
      .num { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #14213d; }
      .delta { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #0f766e; }
      .line { stroke: #8290a6; stroke-width: 3; fill: none; }
      .arrow { stroke: #1f6feb; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
      .teal { fill: #0f766e; }
      .blue { fill: #1f6feb; }
      .gray { fill: #8290a6; }
      .orange { fill: #f59e0b; }
      .soft { fill: #eef2f7; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f6feb"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>

  <text class="title" x="80" y="78">V4.3 相较于 V3.4-FM 的改进</text>
  <text class="subtitle" x="80" y="118">核心变化：从“学整体位移”升级为“直接照顾边界贴合、拐弯处和每个轮廓点的小修正”。</text>

  <rect class="panel" x="70" y="160" width="470" height="555"/>
  <text class="h2" x="110" y="215">V3.4-FM 基线</text>
  <text class="small" x="110" y="250">Flow Matching + 3 步轮廓细化</text>

  <rect class="soft" x="110" y="292" width="390" height="72" rx="12"/>
  <circle class="gray" cx="140" cy="328" r="9"/>
  <text class="txt" x="165" y="321">主轮廓特征</text>
  <text class="small" x="165" y="348">主要依赖当前轮廓点上的特征</text>

  <rect class="soft" x="110" y="385" width="390" height="72" rx="12"/>
  <circle class="gray" cx="140" cy="421" r="9"/>
  <text class="txt" x="165" y="414">位移回归</text>
  <text class="small" x="165" y="441">训练目标偏向“点该移动多少”</text>

  <rect class="soft" x="110" y="478" width="390" height="72" rx="12"/>
  <circle class="gray" cx="140" cy="514" r="9"/>
  <text class="txt" x="165" y="507">统一预测头</text>
  <text class="small" x="165" y="534">每个点缺少独立的细小修正能力</text>

  <rect class="soft" x="110" y="571" width="390" height="88" rx="12"/>
  <circle class="gray" cx="140" cy="607" r="9"/>
  <text class="txt" x="165" y="600">边界没有单独约束</text>
  <text class="small" x="165" y="627">拐角、薄边、细节区域容易不够贴边</text>

  <rect class="panel2" x="595" y="225" width="405" height="425"/>
  <text class="h2" x="638" y="280">保留的稳定部分</text>
  <line class="line" x1="797" y1="310" x2="797" y2="565"/>
  <circle class="blue" cx="797" cy="340" r="12"/>
  <text class="txt" x="835" y="348">检测框与初始轮廓</text>
  <circle class="blue" cx="797" cy="415" r="12"/>
  <text class="txt" x="835" y="423">128 点轮廓表示</text>
  <circle class="blue" cx="797" cy="490" r="12"/>
  <text class="txt" x="835" y="498">Flow Matching</text>
  <circle class="blue" cx="797" cy="565" r="12"/>
  <text class="txt" x="835" y="573">3 步迭代细化</text>
  <text class="small" x="638" y="620">V4.3 不是推倒重来，而是在稳定主线外加边界能力。</text>

  <path class="arrow" d="M540 438 C570 438, 575 438, 595 438"/>
  <path class="arrow" d="M1000 438 C1025 438, 1030 438, 1060 438"/>

  <rect class="panel3" x="1060" y="160" width="470" height="555"/>
  <text class="h2" x="1100" y="215">V4.3 Boundary-Aware FM</text>
  <text class="small" x="1100" y="250">在 V4.0/V4.2 基础上继续增强边界</text>

  <rect fill="#ffffff" x="1100" y="287" width="390" height="62" rx="12"/>
  <circle class="teal" cx="1130" cy="318" r="9"/>
  <text class="txt" x="1155" y="326">沿边界两侧采样细节特征</text>

  <rect fill="#ffffff" x="1100" y="364" width="390" height="62" rx="12"/>
  <circle class="teal" cx="1130" cy="395" r="9"/>
  <text class="txt" x="1155" y="403">拐弯处在训练中权重更高</text>

  <rect fill="#ffffff" x="1100" y="441" width="390" height="72" rx="12"/>
  <circle class="teal" cx="1130" cy="477" r="9"/>
  <text class="txt" x="1155" y="470">每个轮廓点有小修正</text>
  <text class="small" x="1155" y="496">带门控，避免修正过头</text>

  <rect fill="#ffffff" x="1100" y="528" width="390" height="72" rx="12"/>
  <circle class="orange" cx="1130" cy="564" r="9"/>
  <text class="txt" x="1155" y="557">新增边界距离惩罚</text>
  <text class="small" x="1155" y="583">让预测轮廓直接贴近真实边界</text>

  <rect fill="#ffffff" x="1100" y="615" width="390" height="62" rx="12"/>
  <circle class="orange" cx="1130" cy="646" r="9"/>
  <text class="txt" x="1155" y="654">更多训练“已接近边界”的小改动</text>

  <rect class="panel" x="70" y="760" width="1460" height="210"/>
  <text class="h2" x="110" y="815">同一评估设置下的结果变化</text>
  <text class="small" x="110" y="848">BtcvVal 150 张，ODE=10，评估种子 20260504。V3.4-FM 使用 YOLO-m base checkpoint。</text>

  <g transform="translate(110,885)">
    <text class="metric" x="0" y="24">IoU</text>
    <rect class="gray" x="110" y="4" width="267" height="18" rx="9"/>
    <rect class="teal" x="110" y="32" width="269" height="18" rx="9"/>
    <text class="small" x="395" y="20">0.8925 -> 0.8994</text>
    <text class="delta" x="560" y="28">+0.0069</text>

    <text class="metric" x="700" y="24">mBoundF</text>
    <rect class="gray" x="830" y="4" width="232" height="18" rx="9"/>
    <rect class="teal" x="830" y="32" width="236" height="18" rx="9"/>
    <text class="small" x="1085" y="20">0.7755 -> 0.7864</text>
    <text class="delta" x="1250" y="28">+0.0109</text>
  </g>

  <g transform="translate(110,940)">
    <text class="metric" x="0" y="24">Dice</text>
    <rect class="gray" x="110" y="4" width="282" height="18" rx="9"/>
    <rect class="teal" x="110" y="32" width="284" height="18" rx="9"/>
    <text class="small" x="410" y="20">0.9414 -> 0.9458</text>
    <text class="delta" x="575" y="28">+0.0044</text>

    <text class="metric" x="700" y="24">IoU 波动</text>
    <rect class="gray" x="830" y="4" width="104" height="18" rx="9"/>
    <rect class="teal" x="830" y="32" width="87" height="18" rx="9"/>
    <text class="small" x="955" y="20">0.0260 -> 0.0218</text>
    <text class="delta" x="1120" y="28">下降 0.0043</text>
  </g>
</svg>
