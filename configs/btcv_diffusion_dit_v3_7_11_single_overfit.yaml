# V3.7.11 Fine-tuning config
# Resume from V3.7.9 epoch 700 (97.2% IoU) with very low LR for precision
# Goal: push from 97% → 99.9% via ultra-precise parameter updates
# Strategy: cosine LR from 1e-5 → 1e-8 over 10K epochs

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_diffusion_dit_v3_7_11_single_overfit"

gpus: [2]
resume: true

train_or_test: train

train:
    dataset: 'BtcvMini'
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    per_contour: false

    optim: 'adamw'
    lr: 0.00001
    eta_min: 0.00000001
    batch_size: 1
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.0
    warmup_steps: 0

    epoch: 10000
    num_workers: 0
    save_ep: 500

test:
    dataset: 'BtcvMini'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 1
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

# Standard V3.6 architecture (same as V3.7.9)
use_dit_v3_7: false
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

# Pure direct regression
flow_noise_scale: 0.0
flow_fix_t0: true

# Deterministic inference
infer_avg_samples: 1
infer_noise_scale: 0.0

use_iterative_refinement: false
fourier_smooth_k: 0

use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true
