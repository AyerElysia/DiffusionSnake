# V8.3a Locate-Conditioned DiT (GT-init isolation).
# Purpose: ignore detector quality and test whether frozen Locate/MoonViT
# dense features improve diffusion/DiT contour refinement.

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/1232_final_v8_3a_locate_feature_dit_gtinit_gpu6"

gpus: [7]
resume: true
resume_weights_only: true
resume_path: "data/outputs/1232_final_v8_2_mged_final_gpu6/checkpoints/latest.pt"

train_or_test: train

train:
    dataset: 'BtcvTrain'
    data_path: '/home/medteam/Zhrch/Datasets/1232_final/train'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 2e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 1
    max_ct_num: 8
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 100
    eta_min: 0.0000001

    epoch: 10000
    num_workers: 0
    save_ep: 50

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/Datasets/1232_final/test'
    epoch: -1

detector_backend: 'moonvit_heatmap'
moonvit_root: 'Eagle/Embodied'
moonvit_pretrained_path: 'Eagle/Embodied/work_dirs/1232_final_locany_full_more10000/checkpoint-3000'
moonvit_freeze: true
moonvit_input_norm: 'snake_bgr_to_locate_rgb'
moonvit_patch_size: 14
moonvit_num_layers: 27
moonvit_num_heads: 16
moonvit_hidden_size: 1152
moonvit_intermediate_size: 4304
moonvit_pos_h: 64
moonvit_pos_w: 64
moonvit_out_channels: 64
moonvit_head_conv: 256
moonvit_target_stride: 4
moonvit_max_input_size: 224

use_heatmap_mask_head: false
heatmap_wh_weight: 0.1
heatmap_mask_guidance_alpha: 0.0

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: true

loss_scales: {det: 0.0, mask: 0.0, ex: 0.0, diff: 1.0, prior: 0.0, smooth: 0.0, curv: 0.0}
skip_diffusion_forward: false
detector_only_warmup: false

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/1232_final_disp_stats_octagon.json"

use_dit_v3: true
use_dit_v4_1: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: true
iterative_num_steps: 5
iterative_fractions: [0.3333, 0.5, 0.80, 0.97, 1.0]
iterative_ode_steps: 20

infer_noise_scale: 1.0
infer_avg_samples: 1

use_grpo: false
heads: {'ct_hm': 52, 'wh': 2}
yolo_num_classes: 52
freeze_yolo: false
freeze_snake: false
segm_or_bbox: 'segm'
use_diffusion_trainer: true
use_extreme_refine: false
use_pred_extreme_init_for_diffusion: false
use_pred_extreme_init_for_inference: false
detach_pred_extreme_init: true

v4_1_use_p3_features: false
v4_1_use_detail_context: true
v4_1_detail_context_mode: 'normal'
v4_1_use_per_point_delta: false
v4_1_use_curvature_reweight: false
v4_1_small_disp_prob: 0.25
v4_1_small_disp_min_frac: 0.80
v4_1_small_disp_max_frac: 0.95

v4_1_final_head_type: 'moe'
v4_6_moe_num_experts: 8
v4_6_moe_top_k: 2
v4_6_moe_balance_weight: 0.001
v4_6_moe_expert_init_std: 0.0001
v4_6_moe_router_noise_std: 0.01
v4_6_moe_use_point_embed: true
v4_6_moe_use_cyclic_router: true
v4_6_moe_use_shared_expert: true
v4_6_moe_routed_expert_scale: 1.0
v4_6_moe_expert_type: 'mlp'
v4_6_moe_expert_hidden_dim: 256

v4_9_use_rich_state_sampling: true
v4_9_use_rich_infer_schedule: true
v4_9_infer_target_fractions: [0.3333, 0.5, 0.80, 0.97, 1.0]
v4_9_continuous_state_prob: 0.15
v4_9_discrete_state_prob: 0.40
v4_9_discrete_fractions: [0.3333, 0.5, 1.0]
v4_9_small_state_prob: 0.25
v4_9_small_state_min_frac: 0.80
v4_9_small_state_max_frac: 0.95
v4_9_hard_far_state_prob: 0.05
