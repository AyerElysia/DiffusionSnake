# V6r: Self-Conditioning Fine-tune
# 
# Key idea (from "Improved Denoising Diffusion Probabilistic Models"):
#   At training (50% of steps): dry-run forward pass -> x1_self = x_t + (1-t)*v_dry
#   At inference: x1_self updated each ODE step, always conditioned on previous estimate
#   
# This gives the model global shape context (where all 128 points are going) at each step,
# enabling more consistent predictions and reducing the correlated errors that cause burrs.
#
# Architecture: v6m (v6k base + multistep) + self-conditioning residual (zero-init, 512 params)
# Resume: v6m epoch20 checkpoint (0.890066 IoU)
# Expected: +2-4% IoU from self-consistency, especially on complex organ boundaries

model: 'sbd'
network: 'ro_34'
task: 'snake'

train:
    dataset: 'BtcvTrain'
    batch_size: 12
    epoch: 60
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_new_snake'

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

lr: 0.000001
lr_decay: 0.5
weight_decay: 0.0001
warmup_steps: 0
scheduler: cosine_annealing

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 0.3
infer_noise_scale: 0.0

use_iterative_refinement: true
iterative_num_steps: 3
iterative_fractions: [0.3333, 0.5, 1.0]
iterative_ode_steps: 50

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

use_dit_v3_7: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

v3_7_use_per_point_head: true
v3_7_use_regularized_per_point: false
v3_7_use_scale_conditioning: true
v3_7_use_detail_context: true
v3_7_use_detail_curve_context: true
v3_7_detail_context_mode: 'normal_tangent'
v3_7_detail_curve_inject_mode: 'point'
v3_7_delta_scale: 0.1
v3_7_delta_reg_weight: 0.001
v3_7_laplacian_weight: 0.0
v3_7_spectral_loss_k: 0
v3_7_hf_loss_weight: 0.1
v3_7_use_curvature_reweight: false
v3_7_ode_smooth_k: 0
v3_7_ode_solver: euler

# V6r: Self-conditioning enabled
v3_7_use_self_conditioning: true

v3_7_use_p3_features: false

infer_avg_samples: 0

use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true

# Resume from best v6m checkpoint (0.890066 IoU on full val)
# NOTE: resume path is passed via ONE_SAMPLE_RESUME_PATH env var
resume: true
resume_weights_only: true
