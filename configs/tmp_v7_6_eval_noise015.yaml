# V7.6 Conditional Residual Explorer Long.
# Long continuation from the best V7.4 checkpoint.  The explorer stays
# conditional/adaptive, while the main flow is updated conservatively through
# the existing V5 geom-action GRPO loop.

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/1232_final_v7_6_conditional_residual_explorer_long_gpu3"

gpus: [3]
resume: false
resume_weights_only: true
resume_path: "data/outputs/1232_final_v7_4_adaptive_fourier_explorer_grpo_from_v5best_long_gpu7/checkpoints/best_iou.pt"

train_or_test: train

train:
    dataset: 'BtcvTrain'
    data_path: '/home/medteam/Zhrch/Datasets/1232_final/train'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 8.0e-9
    batch_size: 1
    gradient_accumulation_steps: 1
    gradient_clip: 0.20
    weight_decay: 0.0
    warmup_steps: 0

    epoch: 10000
    num_workers: 0
    save_ep: 100
    save_every: 100

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/Datasets/1232_final/test'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: true

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/1232_final_disp_stats_octagon.json"

use_dit_v3: true
use_dit_v4_1: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: true
iterative_num_steps: 3
iterative_fractions: [0.3333, 0.5, 1.0]
iterative_ode_steps: 20

infer_noise_scale: 0.15
infer_avg_samples: 1

use_grpo: true
grpo_pure_rl_loss: true
grpo_first_contour_only: false
grpo_steps: 3

freeze_yolo: true
freeze_snake: false
heads: {'ct_hm': 52, 'wh': 2}
yolo_num_classes: 51
segm_or_bbox: 'segm'
use_diffusion_trainer: true

yolo_model_scale: 's'
v4_1_use_p3_features: true
v4_1_use_detail_context: true
v4_1_detail_context_mode: 'normal'
v4_1_use_per_point_delta: false
v4_1_use_curvature_reweight: false
v4_1_small_disp_prob: 0.25
v4_1_small_disp_min_frac: 0.80
v4_1_small_disp_max_frac: 0.95

v4_1_final_head_type: 'moe'
v4_6_moe_num_experts: 8
v4_6_moe_top_k: 2
v4_6_moe_balance_weight: 0.001
v4_6_moe_expert_init_std: 0.0001
v4_6_moe_router_noise_std: 0.01
v4_6_moe_use_point_embed: true
v4_6_moe_use_cyclic_router: true
v4_6_moe_use_shared_expert: true
v4_6_moe_routed_expert_scale: 1.0
v4_6_moe_expert_type: 'mlp'
v4_6_moe_expert_hidden_dim: 256

v4_9_use_rich_state_sampling: true
v4_9_use_rich_infer_schedule: false
v4_9_infer_target_fractions: [0.3333, 0.5, 1.0]
v4_9_continuous_state_prob: 0.15
v4_9_discrete_state_prob: 0.40
v4_9_discrete_fractions: [0.3333, 0.5, 1.0]
v4_9_small_state_prob: 0.25
v4_9_hard_far_state_prob: 0.05
v4_9_near_zero_state_prob: 0.15
v4_9_continuous_min_frac: 0.05
v4_9_continuous_max_frac: 0.85
v4_9_hard_far_min_frac: 0.0
v4_9_hard_far_max_frac: 0.20
v4_9_near_zero_min_frac: 0.97
v4_9_near_zero_max_frac: 0.999

dataloader_persistent_workers: false
dataloader_prefetch_factor: 0

rl_v4_train_steps: 5000
rl_v4_k: 8
rl_v4_outer_steps: 3
rl_v4_fractions: [0.3333, 0.5, 1.0]
rl_v4_ode_steps: 10
rl_v4_max_contours: 4
rl_v4_action_policy: 'band_detail'
rl_v4_geom_lowfreq_modes: 8
rl_v4_geom_sigma_px: [0.0, 0.0, 0.45]
rl_v4_detail_k_min: 9
rl_v4_detail_k_max: 28
rl_v4_detail_sigma_px: [0.0, 0.0, 0.32]
rl_v4_detail_gate: [0.0, 0.0, 0.35]
rl_v4_detail_logprob_weight: 0.25
rl_v4_prefix_distill_weight: 0.06
rl_v4_prefix_distill_steps: [0, 1]
rl_v4_adaptive_explorer: true
rl_v4_explorer_hidden_dim: 96
rl_v4_explorer_mu_max: 0.45
rl_v4_explorer_logstd_min: -1.70
rl_v4_explorer_logstd_max: 0.55
rl_v4_explorer_lr: 4.0e-8
rl_v4_ppo_inner_epochs: 2
rl_v4_ppo_clip: 0.05
rl_v4_ppo_kl_target: 0.002
rl_v4_kl_beta: 0.012
rl_v4_adv_clip_max: 2.0
rl_v4_gate_margin: 0.0
rl_v4_grad_clip_norm: 0.20
rl_v4_lr: 8.0e-9

rl_v4_reward_w_region: 0.25
rl_v4_reward_w_dice: 0.10
rl_v4_reward_w_iou: 0.22
rl_v4_reward_w_dist: 0.33
rl_v4_reward_dist_max_px: 8.0
rl_v4_reward_dist_quantile: 95.0
rl_v4_reward_dist_quantile_weight: 0.5
rl_v4_reward_burr_weight: 0.08
rl_v4_reward_burr_max_px: 1.5
rl_v4_reward_burr_margin_px: 0.45
rl_v4_reward_burr_quantile: 95.0
rl_v4_reward_global_weight: 0.85
rl_v4_reward_detail_weight: 0.25
rl_v4_reward_detail_w_corner_dist: 0.42
rl_v4_reward_detail_w_curv_match: 0.25
rl_v4_reward_detail_w_local_biou: 0.16
rl_v4_reward_detail_w_burr: 0.10
rl_v4_reward_detail_w_area: 0.03
rl_v4_reward_detail_corner_dist_max_px: 5.0
rl_v4_reward_detail_corner_dist_quantile: 95.0
rl_v4_reward_detail_corner_dist_quantile_weight: 0.7
rl_v4_reward_detail_curvature_max_px: 3.0
rl_v4_reward_detail_local_band_radius_px: 2
rl_v4_reward_detail_area_max_frac: 0.12
rl_v4_viz_every: 0

rl_v4_eval_batches: 8
rl_v4_eval_every: 100
rl_v4_save_every: 100
rl_v4_log_every: 1
rl_v4_seed: 20260610
rl_v4_min_load_ratio: 95.0
