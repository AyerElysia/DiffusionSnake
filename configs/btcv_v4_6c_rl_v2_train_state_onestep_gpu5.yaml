# V4.6c RL V2: train-state one-step aligned Flow-GRPO.
# Inherits completed V4.6c new-distribution checkpoint; no random init.

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_select_v4_6c_rl_v2_train_state_onestep_ode20_long_gpu5"

gpus: [5]
resume: false
resume_weights_only: true
resume_path: "data/outputs/btcv_diffusion_dit_v4_6c_mlp_shared_moe_newdist_long_gpu5/checkpoints/latest.pt"

train_or_test: train

train:
    dataset: 'BtcvTrain'
    data_path: '../Datasets/BTCV/btcv_select/train'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 5.0e-8
    milestones: (2000, 4000)
    gamma: 0.5
    batch_size: 1
    gradient_accumulation_steps: 1
    gradient_clip: 0.3
    weight_decay: 0.0
    warmup_steps: 0
    beta: 0.04
    clip_range: 0.05
    adv_clip_max: 2.0
    grpo_v2_gate_margin: 0.0

    epoch: 1000
    num_workers: 0
    save_ep: 100
    save_every: 100

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '../Datasets/BTCV/btcv_select/test'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

use_dit_v3: true
use_dit_v4_1: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: true
iterative_num_steps: 5
iterative_fractions: [0.3333, 0.5, 0.80, 0.97, 1.0]
iterative_ode_steps: 20

infer_noise_scale: 1.0
infer_avg_samples: 1

use_grpo: true
grpo_pure_rl_loss: true
grpo_first_contour_only: false
grpo_steps: 20

freeze_yolo: true
freeze_snake: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true

yolo_model_scale: 's'
v4_1_use_p3_features: true
v4_1_use_detail_context: true
v4_1_detail_context_mode: 'normal'
v4_1_use_per_point_delta: false
v4_1_use_curvature_reweight: false
v4_1_small_disp_prob: 0.25
v4_1_small_disp_min_frac: 0.80
v4_1_small_disp_max_frac: 0.95

v4_1_final_head_type: 'moe'
v4_6_moe_num_experts: 8
v4_6_moe_top_k: 2
v4_6_moe_balance_weight: 0.001
v4_6_moe_expert_init_std: 0.0001
v4_6_moe_router_noise_std: 0.01
v4_6_moe_use_point_embed: true
v4_6_moe_use_cyclic_router: true
v4_6_moe_use_shared_expert: true
v4_6_moe_routed_expert_scale: 1.0
v4_6_moe_expert_type: 'mlp'
v4_6_moe_expert_hidden_dim: 256

v4_9_use_rich_state_sampling: true
v4_9_use_rich_infer_schedule: true
v4_9_infer_target_fractions: [0.3333, 0.5, 0.80, 0.97, 1.0]
v4_9_continuous_state_prob: 0.15
v4_9_discrete_state_prob: 0.40
v4_9_discrete_fractions: [0.3333, 0.5, 1.0]
v4_9_small_state_prob: 0.25
v4_9_hard_far_state_prob: 0.05
v4_9_near_zero_state_prob: 0.15
v4_9_continuous_min_frac: 0.05
v4_9_continuous_max_frac: 0.85
v4_9_hard_far_min_frac: 0.0
v4_9_hard_far_max_frac: 0.20
v4_9_near_zero_min_frac: 0.97
v4_9_near_zero_max_frac: 0.999

dataloader_persistent_workers: false
dataloader_prefetch_factor: 0

grpo_v2_aligned_policy_only: true
grpo_v2_train_steps: 3000
grpo_v2_rollout_source: 'train_state_onestep'
grpo_v2_rollout_iterative: false
grpo_v2_onestep: true
grpo_v2_onestep_steps: 20
grpo_v2_update_only_if_beats_det: true
grpo_v2_eval_batches: 8
grpo_v2_k: 8
grpo_v2_rollout_steps: 20
grpo_v2_rollout_noise_scale: 0.5
grpo_v2_det_rollout_steps: 20
grpo_v2_window_size: 4
grpo_v2_window_range: [12, 20]

grpo_v2_action_std: 0.02
grpo_v2_action_std_min: 0.02
grpo_v2_action_std_decay: 1.0
grpo_v2_latent_policy: 0
grpo_v2_latent_ppo_weight: 0.0
grpo_v2_latent_ranker: 0
grpo_v2_latent_ranker_weight: 0.0

grpo_v2_ppo_inner_epochs: 2
grpo_v2_ppo_clip: 0.05
grpo_v2_ppo_kl_target: 0.002
grpo_v2_kl_beta: 0.01
grpo_v2_adv_clip_max: 2.0

grpo_v2_reward_abs_weight: 0.0
grpo_v2_reward_delta_weight: 1.0
grpo_v2_reward_w_region: 0.30
grpo_v2_reward_w_dice: 0.10
grpo_v2_reward_w_iou: 0.25
grpo_v2_reward_w_dist: 0.35
grpo_v2_reward_dist_max_px: 8.0
grpo_v2_reward_dist_quantile: 95.0
grpo_v2_reward_dist_quantile_weight: 0.5

grpo_v2_adv_distill: 0
grpo_v2_distill_weight: 0.0
grpo_v2_distill_compare_det: 1
grpo_v2_distill_det_margin: 0.0
grpo_v2_distill_min_delta: 0.0
grpo_v2_distill_loss_clip: 0.0
grpo_v2_distill_t_late_prob: 0.0
grpo_v2_distill_t_late_min: 0.75

grpo_v2_ema_decay: 0.99
grpo_v2_grad_clip_norm: 0.3
grpo_v2_eval_every: 20
grpo_v2_viz_every: 20
grpo_v2_save_every: 100
grpo_v2_log_every: 1
grpo_v2_seed: 20260524
grpo_v2_lr: 5.0e-8
