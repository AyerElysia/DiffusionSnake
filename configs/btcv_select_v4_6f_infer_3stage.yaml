# V4.6f current checkpoint, normal 3-stage inference.
# Used to test whether near-zero + exact-zero training helps without late near-zero over-refinement.

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_select_v4_6f_infer_3stage"

gpus: [5]
resume: true
resume_weights_only: true
resume_path: "data/outputs/btcv_select_v4_6f_dit_moe_exact_zero_refine_gpu4/checkpoints/latest.pt"

train_or_test: test

train:
    dataset: 'BtcvTrain'
    data_path: '../Datasets/BTCV/btcv_select/train'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 3e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 20
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 100

    epoch: 8000
    num_workers: 4
    save_ep: 50

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '../Datasets/BTCV/btcv_select/test'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

use_dit_v3: true
use_dit_v4_1: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: true
iterative_num_steps: 3
iterative_fractions: [0.3333, 0.5, 1.0]
iterative_ode_steps: 20

infer_noise_scale: 1.0
infer_avg_samples: 1

use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true

yolo_model_scale: 's'
v4_1_use_p3_features: true
v4_1_use_detail_context: true
v4_1_detail_context_mode: 'normal'
v4_1_use_per_point_delta: false
v4_1_use_curvature_reweight: false
v4_1_small_disp_prob: 0.10
v4_1_small_disp_min_frac: 0.80
v4_1_small_disp_max_frac: 0.95

v4_1_final_head_type: 'moe'
v4_6_moe_num_experts: 8
v4_6_moe_top_k: 2
v4_6_moe_balance_weight: 0.001
v4_6_moe_expert_init_std: 0.0001
v4_6_moe_router_noise_std: 0.01
v4_6_moe_use_point_embed: true
v4_6_moe_use_cyclic_router: true
v4_6_moe_use_shared_expert: true
v4_6_moe_routed_expert_scale: 1.0
v4_6_moe_expert_type: 'mlp'
v4_6_moe_expert_hidden_dim: 256

v4_10_use_dit_ffn_moe: true
v4_10_dit_ffn_moe_num_experts: 4
v4_10_dit_ffn_moe_top_k: 2
v4_10_dit_ffn_moe_hidden_dim: 256
v4_10_dit_ffn_moe_balance_weight: 0.001
v4_10_dit_ffn_moe_router_noise_std: 0.01
v4_10_dit_ffn_moe_expert_init_std: 0.0001
v4_10_dit_ffn_moe_routed_scale: 1.0
v4_10_dit_ffn_moe_use_point_embed: true
v4_10_dit_ffn_moe_use_cyclic_router: true

v4_9_use_rich_infer_schedule: false

dataloader_persistent_workers: true
dataloader_prefetch_factor: 2
