# V3.7 Per-Point Output Head + Float64 Precision — single-sample overfit config
# Uses float64 per-point weights to break through the float32 precision wall.
# Previous float32 per-point heads achieved 99.74% IoU with loss=5.5e-14,
# limited by float32 ULP (~9.5e-7) for displacement values around ±8.

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_diffusion_dit_v3_7_f64_single_overfit"

gpus: [0]
resume: false
train_or_test: train

train:
    dataset: 'BtcvMini'
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    per_contour: false
    optim: 'adamw'
    lr: 5e-4
    milestones: (3000, 6000, 8000)
    gamma: 0.5
    batch_size: 1
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.0
    warmup_steps: 50
    epoch: 10000
    num_workers: 0
    save_ep: 100

test:
    dataset: 'BtcvMini'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 1
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

# V3.7 Per-Point Head denoiser with float64 precision
use_dit_v3_7: true
v3_7_use_per_point_head: true
v3_7_use_float64_head: true
v3_7_inject_at_input: false
v3_7_inject_at_output: false
v3_7_point_embed_scale: 0.1
v3_7_laplacian_weight: 0.0
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

# Pure regression
flow_noise_scale: 0.0
flow_fix_t0: true

# Inference: deterministic single-step
infer_avg_samples: 1
infer_noise_scale: 0.0

use_iterative_refinement: false
fourier_smooth_k: 0

use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true
