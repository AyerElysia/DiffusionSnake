# V3.7.7 single-sample overfit config
# Same as V3.7.6 (pure direct regression) but WITHOUT circular conv smoothing
# Uses V3.6 (standard DiT) architecture to test if anti-burr layers help or hurt
# Hypothesis: for pure regression, smoothing might limit precision

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_diffusion_dit_v3_7_7_single_overfit"

gpus: [2]
resume: false

train_or_test: train

train:
    dataset: 'BtcvMini'
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    per_contour: false

    optim: 'adamw'
    lr: 5e-4
    milestones: (3000, 6000, 8000)
    gamma: 0.5
    batch_size: 1
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.05
    warmup_steps: 50

    epoch: 10000
    num_workers: 0
    save_ep: 100

test:
    dataset: 'BtcvMini'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 1
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

# Standard V3.6 architecture (NO circular conv)
use_dit_v3_7: false
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

# === V3.7.7: PURE DIRECT REGRESSION (no smoothing) ===
flow_noise_scale: 0.0
flow_fix_t0: true

# Inference: deterministic single-step
infer_avg_samples: 1
infer_noise_scale: 0.0

# No iterative refinement, no post-processing
use_iterative_refinement: false
fourier_smooth_k: 0

use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true
