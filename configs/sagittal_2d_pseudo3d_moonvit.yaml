# Sagittal pseudo-3D standard head + frozen MoonViT dense-feature cache smoke experiment.
# The extractor writes <locate_feat_cache_root>/<manifest split>/<case_id>/x####.npz.

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: 'data/outputs/sagittal_2d_pseudo3d_moonvit'

gpus: [0]
resume: false
resume_weights_only: false
resume_path: ''

train_or_test: train

train:
    # Current cache covers only the first training case. Override with
    # SagittalPseudo3DTrain only after the full training cache is extracted.
    dataset: 'SagittalPseudo3DMini'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 5e-6
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 1
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 100

    epoch: 1
    max_steps: 100
    num_workers: 0
    save_ep: 1

test:
    dataset: 'SagittalPseudo3DVal'
    batch_size: 1
    epoch: -1

pseudo3d_mean: 0.0
pseudo3d_std: 1.0
pseudo3d_color_aug: false
pseudo3d_lr_flip: false
pseudo3d_random_crop: false
pseudo3d_input_mode: 'neighbors'

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: true
use_gt_det_train_only: true
gt_detection_class_offset: 1

# YOLOv8-P2 is retained; the V4.1 residual also consumes the YOLO P3 feature.
detector_backend: 'yolo'
load_yolo_pretrained: true
require_yolo_pretrained: true
pseudo3d_symmetric_stem_init: true
yolo_pretrained: 'data/pretrained/yolov8s.pt'
yolo_model_scale: 's'
yolo_num_classes: 25

loss_scales: {det: 1.0, diff: 1.0, prior: 0.0, smooth: 0.0, curv: 0.0}

use_diffusion_evolution: true
use_flow_matching: true
flow_2d_s_conditioning: true
flow_ode_steps: 10
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: 'data/stats/sagittal_2d_pseudo3d_disp_stats.json'

use_dit_v3: true
use_dit_v4_1: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: true
iterative_num_steps: 5
iterative_fractions: [0.3333, 0.5, 0.80, 0.97, 1.0]
iterative_ode_steps: 20

infer_noise_scale: 1.0
infer_avg_samples: 1

use_grpo: false
heads: {'ct_hm': 26, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true

# Explicit no-detail-context ablation across all supported DiT detail switches.
v3_4_use_p3_features: false
v3_4_use_detail_context: false
v3_4_detail_context_mode: 'normal'
v3_7_use_p3_features: false
v3_7_use_detail_context: false
v3_7_use_detail_curve_context: false
v3_7_detail_context_mode: 'normal'
v4_use_p3_features: false
v4_use_detail_context: false
v4_1_use_p3_features: true
v4_1_use_detail_context: false
v4_1_detail_context_mode: 'normal'
v4_2_use_p3_features: false
v4_2_use_detail_context: false
v4_2_detail_context_mode: 'normal_band'

v4_1_use_per_point_delta: false
v4_1_use_curvature_reweight: false
v4_1_small_disp_prob: 0.25
v4_1_small_disp_min_frac: 0.80
v4_1_small_disp_max_frac: 0.95

# Standard V4.1 final head; no V4.1 final-head MoE.
v4_1_final_head_type: 'standard'

# Explicitly disable routed experts inside DiT FFN branches.
v4_10_use_dit_ffn_moe: false

v4_9_use_rich_state_sampling: true
v4_9_use_rich_infer_schedule: true
v4_9_infer_target_fractions: [0.3333, 0.5, 0.80, 0.97, 1.0]
v4_9_continuous_state_prob: 0.15
v4_9_discrete_state_prob: 0.40
v4_9_discrete_fractions: [0.3333, 0.5, 1.0]
v4_9_small_state_prob: 0.25
v4_9_hard_far_state_prob: 0.05
v4_9_near_zero_state_prob: 0.15
v4_9_continuous_min_frac: 0.05
v4_9_continuous_max_frac: 0.85
v4_9_hard_far_min_frac: 0.0
v4_9_hard_far_max_frac: 0.20
v4_9_near_zero_min_frac: 0.97
v4_9_near_zero_max_frac: 0.999

# Frozen MoonViT layer_18 cache. Each slice stores 1152 channels; the sagittal
# dataset concatenates the center feature with the mean of its two neighbors.
locate_feat_inject: true
locate_feat_replace: false
locate_feat_cache_root: 'data/sagittal_moonvit_cache'
locate_feat_cache_dir: 'data/sagittal_moonvit_cache'
locate_feat_keys: ['layer_18']
locate_feat_dim: 2304

# Sagittal cache contract and preprocessing provenance.
sagittal_moonvit_cache_root: 'data/sagittal_moonvit_cache'
sagittal_moonvit_feature_key: 'layer_18'
sagittal_moonvit_fusion_mode: 'center_neighbor_mean'
sagittal_moonvit_expected_input_size: 448
sagittal_moonvit_expected_patch_size: 14
sagittal_moonvit_expected_normalization: 'moonvit_pretrained_rgb_mean_std'
sagittal_moonvit_expected_checkpoint: '/home/medteam/Zhrch/DiffusionSnake-12-30/Eagle/Embodied/work_dirs/1232_final_locany_full_more10000/checkpoint-3000'

# Extraction bookkeeping; run the companion script with its defaults.
locate_feat_manifest: '/home/medteam/Zhrch/detect_3D_lgz2/datasets/sagittal_2d_fixed/manifests/slice_manifest.csv'
locate_feat_layers: [18]
locate_feat_input_size: 448
locate_feat_patch_size: 14
locate_feat_normalization: 'moonvit_pretrained_rgb_mean_std'
locate_feat_checkpoint: '/home/medteam/Zhrch/DiffusionSnake-12-30/Eagle/Embodied/work_dirs/1232_final_locany_full_more10000/checkpoint-3000'

# The P2/P3 YOLO feature maps remain the detector-side input to the standard head.
dataloader_persistent_workers: false
dataloader_prefetch_factor: 2
