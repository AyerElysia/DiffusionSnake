# V3.5 Phase 1 test: Fourier smoothing on V3.0 10k checkpoint
# Usage: test inference only — load trained V3.0 weights, apply Fourier post-processing

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_diffusion_dit_v3_overfit_single_gpu7_e10000"

gpus: [7]
resume: true

train_or_test: test

train:
    dataset: 'BtcvMini'
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    per_contour: false
    epoch: 10000
    batch_size: 1
    num_workers: 0
    save_ep: 100
    optim: 'adamw'
    lr: 5e-5
    milestones: (80, 120)
    gamma: 0.5

test:
    dataset: 'BtcvMini'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
diffusion_timesteps: 1000
use_ddim_inference: true
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

use_dit_v3: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

fourier_smooth_k: 12

use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true
