# DiT V3.2 配置文件 — BTCV 数据集
# Flow Matching + Self/Cross Attention (Efficient, No Joint Attention Redundancy)

# ===== 模型配置 =====
model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/model/btcv_diffusion_dit_v3_2"

gpus: [7]
resume: false

# ===== 训练配置 =====
train_or_test: train

train:
    dataset: 'BtcvTrain'
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_new_snake'
    per_contour: false

    optim: 'adamw'
    lr: 5e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 64
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 1000

    epoch: 1000
    num_workers: 4
    save_ep: 10

# ===== 测试配置 =====
test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

# ===== 检测配置 =====
use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

# ===== 损失权重 =====
loss_scales: {det: 0, ex: 1.0, py: 1.2}

# ===== Flow Matching 配置 =====
use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 10
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats.json"

# ===== DiT V3.2 去噪器核心配置 =====
use_dit_v3_2: true           # V3.2: Self+Cross + Flow Matching
dit_num_layers: 6            # 去噪深度
dit_num_heads: 8             # 注意力头数
dit_state_dim: 256           # 特征维度

# ===== 系统开关 =====
use_grpo: false              # 是否开启 GRPO 强化学习
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true
