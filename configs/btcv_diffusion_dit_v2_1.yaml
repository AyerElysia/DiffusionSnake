# DiT V2 配置文件 — BTCV 数据集
# 基于 DiT V2 全面升级: RMSNorm + QK-Norm + SwiGLU + CyclicRoPE + 9-param adaLN

# ===== 模型配置 =====
model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/model/btcv_diffusion_dit_v2_1"

gpus: [5]
resume: false

# ===== 训练配置 =====
train_or_test: train

train:
    dataset: 'BtcvTrain'
    data_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_new_snake'
    per_contour: false

    optim: 'adamw'
    lr: 5e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 32
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 1000

    epoch: 1000
    num_workers: 4
    save_ep: 10

# ===== 测试配置 =====
test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

# ===== 检测配置 =====
use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

# ===== 损失权重 =====
loss_scales: {det: 0, ex: 1.0, py: 1.2}

# ===== 扩散模型配置 =====
use_diffusion_evolution: true
diffusion_timesteps: 1000
use_ddim_inference: true
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats.json"

# ===== DiT V2 去噪器配置 =====
use_dit_denoiser: false   # V1 关闭
use_dit_v2_1: true          # V2 启用
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

# ===== GRPO 配置 =====
use_grpo: false

# ===== 其他 =====
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true
