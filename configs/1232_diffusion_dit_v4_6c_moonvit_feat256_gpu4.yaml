# Geometric Bridge FM pretraining (NEW paradigm), trained FROM SCRATCH.
# Fork of 1232_final_diffusion_dit_v4_6c_mlp_shared_moe_pretrain_gpu3.yaml.
# Paradigm: x0 = init contour (zero displacement), x1 = GT displacement,
#   x_t = (1-t)*x0 + t*x1 is the linear init->GT contour bridge,
#   features resampled at the interpolated contour x_t (flow_resample_feat_at_xt).
# This is the NORESAMPLE (B) arm of the A/B ablation: features sampled at fixed init contour.
# Train/test data under /home/medteam/Zhrch/Datasets/1232_final.

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/1232_diffusion_dit_v4_6c_moonvit_feat256_gpu4"

gpus: [7]
resume: true
resume_weights_only: true
resume_path: "data/outputs/1232_final_diffusion_dit_v4_6c_geom_bridge_lineA_moonvit_gpu0/checkpoints/latest.pt"

train_or_test: train

train:
    dataset: 'BtcvTrain'
    data_path: '/home/medteam/Zhrch/Datasets/1232_final/train'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 5e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 2
    gradient_accumulation_steps: 4
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 100

    epoch: 3000
    num_workers: 8
    save_ep: 1

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/Datasets/1232_final/test'
    epoch: -1


# === Line A: MoonViT L18+26 frozen-feature replacement (F2 scheme) ===
detector_backend: 'heatmap_resnet'
heatmap_backbone: 'resnet34'
heatmap_pretrained: false
heatmap_wh_weight: 0.1
locate_feat_inject: false
locate_feat_replace: true
locate_feat_cache_dir: "data/f1_cache/locate896_full/locate_896"
locate_feat_cache_root: "data/f1_cache/locate896_full/locate_896"
locate_feat_keys: ['layer_18', 'layer_26']
locate_feat_dim: 2304
heatmap_feat_channels: 256
locate_feat_replace_out_channels: 256
locate_feat_adapt_hidden_channels: 64
snake_feature_dim: 256

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: true

loss_scales: {det: 1.0, diff: 1.0, prior: 0.0, smooth: 0.0, curv: 0.0}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 0.0
flow_train_noise_scale: 0.0
flow_fix_t0: false

# === Geometric bridge paradigm ===
flow_geom_bridge: true
flow_resample_feat_at_xt: true               # RESAMPLE ON (pure FM: feature at analytic x_t)
flow_geom_infer_resample_per_ode_step: true
flow_geom_sched_sampling: false              # OFF: pure FM, no inference-form unroll in training
flow_geom_sched_inner_steps: 2
flow_geom_sched_prob: 0.0
flow_geom_x0_jitter: 0.0

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
# Bridge requires linear-through-origin normalization so x0=0 == init contour exactly.
diffusion_disp_norm: false
v3_7_use_contour_norm: true
v3_7_optimal_cyclic_align: true              # load-bearing correspondence for straight-line bridge

use_dit_v3: true
use_dit_v4_1: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: false
iterative_num_steps: 3
iterative_fractions: [0.5, 0.85, 1.0]
iterative_ode_steps: 10

infer_noise_scale: 0.0
infer_avg_samples: 1

use_grpo: false
heads: {'ct_hm': 52, 'wh': 2}
yolo_num_classes: 52
segm_or_bbox: 'segm'
use_diffusion_trainer: true

yolo_model_scale: 's'
v4_1_use_p3_features: false
v4_1_use_detail_context: true
v4_1_detail_context_mode: 'normal'
v4_1_use_per_point_delta: false
v4_1_use_curvature_reweight: false
# Bridge subsumes rich-state init advance; disable small-disp augmentation.
v4_1_small_disp_prob: 0.0
v4_1_small_disp_min_frac: 0.80
v4_1_small_disp_max_frac: 0.95

v4_1_final_head_type: 'moe'
v4_6_moe_num_experts: 8
v4_6_moe_top_k: 2
v4_6_moe_balance_weight: 0.001
v4_6_moe_expert_init_std: 0.0001
v4_6_moe_router_noise_std: 0.01
v4_6_moe_use_point_embed: true
v4_6_moe_use_cyclic_router: true
v4_6_moe_use_shared_expert: true
v4_6_moe_routed_expert_scale: 1.0
v4_6_moe_expert_type: 'mlp'
v4_6_moe_expert_hidden_dim: 256

# Bridge x_t IS the rich state -> disable rich-state sampling/schedule.
v4_9_use_rich_state_sampling: false
v4_9_use_rich_infer_schedule: false

dataloader_persistent_workers: true
dataloader_prefetch_factor: 2
