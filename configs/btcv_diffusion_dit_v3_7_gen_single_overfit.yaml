# V3.7-gen: Generalizable anti-burr denoiser
# Designed for multi-sample generalization, validated on single sample.
# Key differences from single-sample V3.7:
#   - Standard Flow Matching (random t, noise > 0)
#   - Regularized per-point heads (shared + delta)
#   - Weight decay, Laplacian regularization
#   - No fix_t0, no RAW mode, no residual

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/v3_7_gen_single"

gpus: [0]
resume: false

train_or_test: train

train:
    dataset: 'BtcvMini'
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    per_contour: false

    optim: 'adamw'
    lr: 0.0001
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 1
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 100

    epoch: 10000
    num_workers: 0
    save_ep: 500

test:
    dataset: 'BtcvMini'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

# Standard Flow Matching (generalizable settings)
use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 0.3
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

# V3.7 denoiser with regularized per-point heads
use_dit_v3_7: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

# Per-point: shared output + delta corrections
v3_7_use_per_point_head: true
v3_7_use_regularized_per_point: true
v3_7_delta_scale: 0.1
v3_7_delta_reg_weight: 0.001

# Smoothness regularization
v3_7_laplacian_weight: 0.01

# Spectral loss: prioritize low-frequency shape accuracy
v3_7_spectral_loss_k: 16
v3_7_hf_loss_weight: 0.1

# No post-processing (network should produce smooth output natively)
fourier_smooth_k: 0
v3_7_ode_smooth_k: 0

use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true
