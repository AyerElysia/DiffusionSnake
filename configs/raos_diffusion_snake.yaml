# NOTE: This config uses RAOS dataset which is NOT available on this machine.
# Data paths below point to old machine location and need to be updated if data is available.

model: 'sbd'
network: 'ro_34'
task: 'snake'
resume: false
gpus: [4]
multistage: False
add_darnet: 0
train_or_test: train
random_num: 0

use_grpo: false
grpo_first_contour_only: true
grpo_window_size: 1
grpo_window_range: [15, 20]

model_dir: "data/model/raos_diffusion"
yolo_pretrained: ""
load_yolo_pretrained: false
freeze_snake: False
freeze_yolo:  False

train:
    beta: 0
    clip_range: 0.001
    adv_clip_max: 5.0

    per_contour: false

    optim: 'adamw'
    lr: 5e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 128
    dataset: 'RaosTrain'
    num_workers: 4
    epoch: 500
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/RAOS/RAOS-Real/CancerImages_Set1/processed_Tr_resized'
    save_ep: 10

loss_scales: {det: 0, ex: 1.0, py: 1.2}

test:
    dataset: 'RaosVal'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/RAOS/RAOS-Real/CancerImages_Set1/processed_Ts_resized'
    epoch: -1

use_nms_for_snake: true

det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true

use_gt_det: false

use_diffusion_evolution: true
diffusion_timesteps: 1000
use_ddim_inference: true
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'

diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/raos_disp_stats.json"

# RAOS masks have class indices up to 19, plus background => 20
heads: {'ct_hm':20, 'wh': 2}
segm_or_bbox: 'segm'

use_diffusion_trainer: true
