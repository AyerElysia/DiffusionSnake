# V0.5 Day1 Exp4: 混合精度 + 量化
# 目标：MoE 专家层和 Memory 编码器使用 float16

model: 'v05_day1_exp4_mixed_precision'
network: 'ro_34'
task: 'snake'
model_dir: 'data/outputs/volmem/v05_day1_exp4_mixed_precision_gpu3'
gpus: [3]
resume: true
resume_weights_only: true
resume_path: 'data/outputs/volmem/verse_memflowdit_v0_5_minimal_gpu6/checkpoints/latest.pt'
train_or_test: train

# *** 启用自动混合精度 (AMP) ***
use_mixed_precision: true
amp_dtype: 'float16'  # 或 'bfloat16'
amp_exclude_modules: ['contour_adapter']  # contour 预测保持 float32

volmem:
    method_name: 'MemFlowDiT'
    maturity: 'baseline'
    task_definition: 'slice_sequential_volumetric_segmentation'
    native_3d_network: false
    manifest_file: '/home/medteam/Zhrch/detect_3D_lgz2/datasets/sagittal_2d_fixed/manifests/slice_manifest.csv'
    data_root: '/home/medteam/Zhrch/detect_3D_lgz2/datasets/sagittal_2d_fixed'
    position_unit: 'index'
    chunks_per_step: 12
    chunk_length: 8
    memory_capacity: 4
    memory_dim: 256
    memory_heads: 8
    memory_pool_size: 8
    mask_channels: 26
    memory_injection: 'flow_dit_block_cross_attention'
    relative_distance_encoding: true
    relative_distance_scale: 4.0
    supports_memory_off_2d: true
    truncated_bptt_steps: 2
    memory_supervision: 'scheduled_prediction_class_aware_mask_evidence'
    inference_memory_source: 'previous_prediction'
    prediction_evidence_start_step: 500
    prediction_evidence_ramp_steps: 4500
    prediction_evidence_max_prob: 0.5

train:
    dataset: 'VolMemTrain'
    per_contour: false
    merge_with_val: false
    optim: 'adamw'
    lr: 0.00001
    locate_lr_multiplier: 2.5
    memory_lr_multiplier: 5.0
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 128
    gradient_accumulation_steps: 2
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 200
    drop_last: true
    epoch: 10000
    num_workers: 0
    save_ep: 10

_experiment_info:
    phase: "day1"
    experiment_id: "exp4"
    name: "Mixed Precision (float16)"
    description: "Enable AMP with float16 for MoE and memory encoder layers"
    expected_speedup: "1.3-1.5x"
    expected_memory_change: "-30%"
    expected_accuracy_impact: "-1%"
    baseline: "verse_memflowdit_v0_5_minimal_gpu6"

