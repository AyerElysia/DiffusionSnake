# 混合精度配置
# 目标: MoE/Memory 层用 float16 → 预期 1.25x 加速 + 30% 显存压缩

model_name: 'MemFlowDiT'
use_mixed_precision: true
moe_precision: 'float16'  # MoE 层用 float16
memory_encoder_precision: 'float16'  # Memory encoder 用 float16
predict_precision: 'float32'  # 保持 float32 精度

chunks_per_step: 12
memory_capacity: 4
