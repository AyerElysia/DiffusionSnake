# Pure-2D paper mainline: L6/F256, Route-B bbox->octagon, v4.10 sampling.
# Memory and the legacy internal heatmap detector are physically absent.
model: 'pure2d_mainline_l6_f256_routeb_v410_48h'
network: 'ro_34'
task: 'snake'
model_dir: 'data/outputs/depth_sweep/pure2d_mainline_l6_f256_routeb_v410_48h'
gpus: [5]
resume: true
resume_weights_only: false
resume_path: 'data/outputs/depth_sweep/pure2d_mainline_l6_f256_routeb_v410_48h/training/pure2d_l6_f256_48h_v1/checkpoints/step_6000.pt'
resume_allow_partial_copy: false
resume_source_format: 'p0_step2000_memory_free_exact_v1'
train_or_test: train

# Construction-time hard gates in diffusion_train.py.
pure2d_memory_free_required: true
pure2d_internal_detector_free_required: true
pure2d_expected_parameter_count: 14373444

train:
    dataset: 'VolMemTrain'
    per_contour: false
    merge_with_val: false
    optim: 'adamw'
    lr: 0.00001
    locate_lr_multiplier: 2.5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 48
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 200
    drop_last: true
    epoch: 10000
    # At the validated isolated A0 rate (~1 s/update), this is about 48 h.
    # Loss is health monitoring only; there is no plateau early stopping.
    max_steps: 180000
    step_checkpoint_every: 500
    step_checkpoint_keep: 12
    num_workers: 8
    save_ep: 0
    max_ct_num: 32

test:
    dataset: 'VolMemDev8'
    batch_size: 1
    epoch: -1

# Train72 / Dev8 split; locked 010/011/013 are forbidden.
sagittal_train_exclude_case_ids: ['sub-verse004', 'sub-verse005', 'sub-verse033', 'sub-verse043', 'sub-verse060', 'sub-verse064', 'sub-verse082', 'sub-verse410_split-verse267']
sagittal_eval_include_case_ids: ['sub-verse004', 'sub-verse005', 'sub-verse033', 'sub-verse043', 'sub-verse060', 'sub-verse064', 'sub-verse082', 'sub-verse410_split-verse267']
sagittal_forbidden_case_ids: ['sub-verse010', 'sub-verse011', 'sub-verse013']
sagittal_expected_train_case_count: 72
sagittal_expected_train_row_count: 13261
sagittal_expected_eval_case_count: 8
sagittal_expected_eval_row_count: 1123

# The separately evaluated detector supplies rectangles at inference.  During
# training GT rectangles exercise the identical bbox->octagon path.
detector_backend: 'flow_box_only'
use_nms_for_snake: true
det_conf_thresh: 0.10
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
heatmap_class_offset: 1
use_gt_det: true
use_gt_det_train_only: true
gt_detection_class_offset: 1
freeze_snake: false
skip_heatmap_detector_when_gt: true

# MoonViT layer18 center-only feature replacement; no Memory/neighbor input.
locate_feat_inject: false
locate_feat_replace: true
locate_feat_cache_root: 'data/sagittal_moonvit_cache'
locate_feat_keys: ['layer_18']
locate_feat_dim: 1152
locate_feat_input_layers: 1
locate_feat_fusion_mode: 'center_only'
sagittal_moonvit_fusion_mode: 'center_only'
sagittal_moonvit_feature_key: 'layer_18'
locate_feat_replace_hidden_dim: 512
locate_feat_replace_out_channels: 256
locate_feat_replace_upscale: 2
locate_feat_resample_padding_mode: 'border'
snake_feature_dim: 256
gcn_sample_mode: 'half_pixel'
gcn_sample_padding_mode: 'border'

sagittal_component_mode: 'significant'
sagittal_max_components_per_class: 4
sagittal_min_component_area_raw: 2.0
sagittal_max_instances_per_slice: 32
min_poly_area_output: 0.5

loss_scales: {det: 0.0, diff: 1.0, prior: 0.0, smooth: 0.0, curv: 0.0}
use_diffusion_evolution: true
use_flow_matching: true
flow_2d_s_conditioning: true
flow_ode_steps: 4
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: 'data/stats/volmem_sagittal_disp_stats.json'
use_dit_v3: true
use_dit_v4_1: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256
use_iterative_refinement: true
iterative_num_steps: 2
iterative_fractions: [0.6667, 1.0]
iterative_ode_steps: 4
v3_7_ode_solver: 'ab2'
infer_noise_scale: 1.0
infer_avg_samples: 1
use_grpo: false
heads: {'ct_hm': 26, 'wh': 2}
yolo_num_classes: 26
segm_or_bbox: 'segm'
use_diffusion_trainer: true
v4_1_use_p3_features: false
v4_1_use_detail_context: false
v4_1_use_per_point_delta: false
v4_1_use_curvature_reweight: false
v4_1_small_disp_prob: 0.25
v4_1_small_disp_min_frac: 0.80
v4_1_small_disp_max_frac: 0.95
v4_1_final_head_type: 'dense_residual'
v5_2_output_dense_residual_hidden_dim: 1024
v4_6_moe_num_experts: 8
v4_6_moe_top_k: 2
v4_6_moe_balance_weight: 0.001
v4_6_moe_expert_init_std: 0.0001
v4_6_moe_router_noise_std: 0.01
v4_6_moe_use_point_embed: true
v4_6_moe_use_cyclic_router: true
v4_6_moe_use_shared_expert: true
v4_6_moe_routed_expert_scale: 1.0
v4_6_moe_expert_type: 'mlp'
v4_6_moe_expert_hidden_dim: 256

# Validated Route B: both GT training boxes and detector inference rectangles
# are converted to the same 12-point octagon, then uniformly sampled to 128.
contour_init_method: 'octagon'
diffusion_init_source: 'bbox_octagon'
box_init_shape: 'octagon'
evolve_init_shape: 'bbox_octagon'
prev_contour_init_prob: 0.0

# v4.10 continuous outer-state training distribution; fixed 8-NFE inference.
v4_9_use_rich_state_sampling: true
v4_9_use_rich_infer_schedule: true
v4_9_infer_target_fractions: [0.6667, 1.0]
v4_10_use_continuous_sampling: true
v4_10_sigma: 0.05
v4_10_uniform_bg_prob: 0.15
v4_10_uniform_blend_lambda: 0.30
v4_10_centers: [0.0, 0.3333, 0.5, 0.80, 0.97]
v4_10_center_weights: [0.2933, 0.1767, 0.27, 0.179, 0.081]

volmem_return_training_prediction: false
use_amp: true
amp_dtype: 'float16'
enable_tf32: true
cudnn_benchmark: true
cuda_empty_cache_interval: 0
