# AUTO-GENERATED depth-sweep arm p2: dit_num_layers=10
# Base: init_unify_route_B_v410.yaml (Route B octagon init + v4_10 continuous sampling)
#
# Fresh DiT layers (index >= 6) are EXACTLY identity at init:
#   DiTBlockV3.adaLN_modulation[-1] is zero-init (dit_blocks_v3.py:248-249) and all
#   three residual branches are gated by it -> x = x + 0*sa + 0*ca + 0*ff = x.
# So every arm is bit-identical to p0 at step 0; any divergence is the new capacity.
# They get lr = base_lr * 20.0 so the gates can lift off zero inside a short screen.
# base_lr stays 1e-5, identical to mainline, so pretrained weights evolve as control.
# 4th-arm config: Route B init + v4_10 continuous outer-loop sampling.
# Route B: unify on the bbox-derived 12-point octagon (decided mainline init).
#   train  get_octagon(quadrangle(bbox))
#   infer  get_octagon(quadrangle(bbox))
# v4_10:  mixture-of-Gaussians outer-state sampling replacing v4_9 discrete+bucket scheme.
#   centers = {0} ∪ v4_9_infer_target_fractions[:-1] = [0, 0.3333, 0.5, 0.80, 0.97]
#   weights = work-proportional blended with Uniform (λ=0.30) = [0.2933, 0.1767, 0.27, 0.179, 0.081]
#   σ = 0.05, 15% uniform background.  Verified: frac≈0 coverage 17.78%, median 0.449.
model: 'depth_sweep_p2_l10'
network: 'ro_34'
task: 'snake'
model_dir: 'data/outputs/depth_sweep/depth_sweep_p2_l10'
gpus: [0]
resume: true
resume_weights_only: true
resume_path: ''  # empty: using --init-memflow-ckpt instead
train_or_test: train

volmem:
    method_name: 'MemFlowDiT'
    maturity: 'baseline'
    task_definition: 'slice_sequential_volumetric_segmentation'
    native_3d_network: false
    manifest_file: '/home/medteam/Zhrch/detect_3D_lgz2/datasets/sagittal_2d_fixed/manifests/slice_manifest.csv'
    data_root: '/home/medteam/Zhrch/detect_3D_lgz2/datasets/sagittal_2d_fixed'
    position_unit: 'index'
    chunks_per_step: 12
    chunk_length: 8
    memory_capacity: 4
    memory_dim: 256
    memory_heads: 8
    memory_pool_size: 8
    mask_channels: 26
    memory_injection: 'flow_dit_block_cross_attention'
    relative_distance_encoding: true
    relative_distance_scale: 4.0
    supports_memory_off_2d: true
    truncated_bptt_steps: 2
    memory_supervision: 'scheduled_prediction_class_aware_mask_evidence'
    inference_memory_source: 'previous_prediction'
    prediction_evidence_start_step: 500
    prediction_evidence_ramp_steps: 4500
    prediction_evidence_max_prob: 0.5

train:
    dataset: 'VolMemTrain'
    per_contour: false
    merge_with_val: false
    optim: 'adamw'
    lr: 0.00001
    locate_lr_multiplier: 2.5
    memory_lr_multiplier: 5.0
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 128
    gradient_accumulation_steps: 1  # OOM mitigation: P2/P3 died at step 39
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 200
    new_layer_lr_multiplier: 20.0
    new_layer_base_depth: 6
    drop_last: true
    epoch: 10000
    num_workers: 0
    save_ep: 1
    max_ct_num: 32

test:
    dataset: 'VolMemVal'
    batch_size: 1
    epoch: -1

# Frozen single-slice detector; contour evolution remains V4.6c.
detector_backend: 'heatmap_resnet'
heatmap_backbone: 'resnet34'
heatmap_pretrained: false
heatmap_feat_channels: 256
use_nms_for_snake: true
det_conf_thresh: 0.10
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
heatmap_class_offset: 1
use_gt_det: true
use_gt_det_train_only: true
gt_detection_class_offset: 1
freeze_snake: false
freeze_heatmap_detector: true
skip_heatmap_detector_when_gt: true

# Frozen MoonViT layer 18.
locate_feat_inject: false
locate_feat_replace: true
locate_feat_cache_root: 'data/sagittal_moonvit_cache'
locate_feat_keys: ['layer_18']
locate_feat_dim: 1152
locate_feat_input_layers: 1
locate_feat_fusion_mode: 'center_only'
sagittal_moonvit_fusion_mode: 'center_only'
sagittal_moonvit_feature_key: 'layer_18'
locate_feat_replace_hidden_dim: 512
locate_feat_replace_out_channels: 256
locate_feat_replace_upscale: 2
locate_feat_resample_padding_mode: 'border'
snake_feature_dim: 256
gcn_sample_mode: 'half_pixel'
gcn_sample_padding_mode: 'border'

sagittal_component_mode: 'significant'
sagittal_max_components_per_class: 4
sagittal_min_component_area_raw: 2.0
sagittal_max_instances_per_slice: 32
min_poly_area_output: 0.5

loss_scales: {det: 0.0, diff: 1.0, prior: 0.0, smooth: 0.0, curv: 0.0}
use_diffusion_evolution: true
use_flow_matching: true
flow_2d_s_conditioning: true
flow_ode_steps: 5
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: 'data/stats/volmem_sagittal_disp_stats.json'
use_dit_v3: true
use_dit_v4_1: true
dit_num_layers: 10
dit_num_heads: 8
dit_state_dim: 256
use_iterative_refinement: true
iterative_num_steps: 5
iterative_fractions: [0.3333, 0.5, 0.80, 0.97, 1.0]
iterative_ode_steps: 20
infer_noise_scale: 1.0
infer_avg_samples: 1
use_grpo: false
heads: {'ct_hm': 26, 'wh': 2}
yolo_num_classes: 26
segm_or_bbox: 'segm'
use_diffusion_trainer: true
v4_1_use_p3_features: false
v4_1_use_detail_context: false
v4_1_use_per_point_delta: false
v4_1_use_curvature_reweight: false
v4_1_small_disp_prob: 0.25
v4_1_small_disp_min_frac: 0.80
v4_1_small_disp_max_frac: 0.95
v4_1_final_head_type: 'dense_residual'
v5_2_output_dense_residual_hidden_dim: 1024
v4_6_moe_num_experts: 8
v4_6_moe_top_k: 2
v4_6_moe_balance_weight: 0.001
v4_6_moe_expert_init_std: 0.0001
v4_6_moe_router_noise_std: 0.01
v4_6_moe_use_point_embed: true
v4_6_moe_use_cyclic_router: true
v4_6_moe_use_shared_expert: true
v4_6_moe_routed_expert_scale: 1.0
v4_6_moe_expert_type: 'mlp'
v4_6_moe_expert_hidden_dim: 256
# Keep v4_9 inference schedule (rich schedule = use infer_target_fractions at test time).
# v4_9_use_rich_state_sampling is superseded by v4_10 during training; kept for infer schedule.
v4_9_use_rich_state_sampling: true
v4_9_use_rich_infer_schedule: true
v4_9_infer_target_fractions: [0.3333, 0.5, 0.80, 0.97, 1.0]
# v4_10 continuous sampling (overrides v4_9 training sampler; infer schedule unchanged)
v4_10_use_continuous_sampling: true
v4_10_sigma: 0.05
v4_10_uniform_bg_prob: 0.15
v4_10_uniform_blend_lambda: 0.30
v4_10_centers: [0.0, 0.3333, 0.5, 0.80, 0.97]
v4_10_center_weights: [0.2933, 0.1767, 0.27, 0.179, 0.081]
volmem_return_training_prediction: true
use_amp: true
amp_dtype: 'float16'
enable_tf32: true
cudnn_benchmark: true
cuda_empty_cache_interval: 0

# --- 4th arm: Route B init + v4_10 continuous sampling ---
box_init_shape: 'octagon'
evolve_init_shape: 'bbox_octagon'
