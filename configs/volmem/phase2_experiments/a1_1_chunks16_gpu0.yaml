# Phase 2 Experiment A1-1: chunks=16 (保守)
# 基于v0.7 balanced_memory
# 预期加速：1.12-1.15x, 显存+5-10%, 无精度影响

model: 'phase2_a1_1_chunks16'
network: 'ro_34'
task: 'snake'
model_dir: 'data/outputs/volmem/phase2_a1_1_chunks16'
gpus: [0]
resume: true
resume_weights_only: true
resume_path: 'data/outputs/volmem/verse_memflowdit_v0_7_balanced_memory_gpu1/checkpoints/latest.pt'
train_or_test: train

volmem:
    method_name: 'MemFlowDiT'
    maturity: 'baseline'
    task_definition: 'slice_sequential_volumetric_segmentation'
    native_3d_network: false
    manifest_file: '/home/medteam/Zhrch/detect_3D_lgz2/datasets/sagittal_2d_fixed/manifests/slice_manifest.csv'
    data_root: '/home/medteam/Zhrch/detect_3D_lgz2/datasets/sagittal_2d_fixed'
    position_unit: 'index'
    # *** MODIFIED for Phase 2 ***
    chunks_per_step: 16  # 12 -> 16
    # ***
    chunk_length: 8
    memory_capacity: 4
    memory_dim: 256
    memory_heads: 8
    memory_pool_size: 8
    mask_channels: 26
    memory_mask_fusion_mode: 'balanced_add'
    memory_mask_evidence_scale: 0.25
    memory_injection: 'flow_dit_block_cross_attention'
    relative_distance_encoding: true
    relative_distance_scale: 4.0
    supports_memory_off_2d: true
    truncated_bptt_steps: 2
    memory_supervision: 'scheduled_prediction_class_aware_mask_evidence'
    inference_memory_source: 'previous_prediction'
    prediction_evidence_start_step: 250
    prediction_evidence_ramp_steps: 750
    prediction_evidence_max_prob: 0.5

train:
    dataset: 'VolMemTrain'
    per_contour: false
    merge_with_val: false
    optim: 'adamw'
    lr: 0.00001
    locate_lr_multiplier: 2.5
    memory_lr_multiplier: 5.0
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 128
    gradient_accumulation_steps: 2
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 200
    drop_last: true
    epoch: 10000
    num_workers: 0
    save_ep: 1

test:
    dataset: 'VolMemVal'

# Experiment tracking
_experiment_info:
    phase: 2
    experiment_id: 'A1-1'
    description: 'Increase chunks_per_step 12->16 (conservative)'
    expected_speedup: '1.12-1.15x'
    expected_memory_change: '+5-10%'
    expected_accuracy_impact: 'none'
    baseline: 'verse_memflowdit_v0_7_balanced_memory_gpu1'

