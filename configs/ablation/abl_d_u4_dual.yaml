# MoonViT point-feature ablation, arm: D dual + upscale4
#
# Shared with every arm in configs/ablation/:
#   - warm start from data/warmstart/moonvit_u2_single_ep77.pt (DiT weights)
#   - locate_feat_replacer.* excluded from the warm start, so the projection
#     trains from scratch in every arm (equal handicap)
#   - lr 5e-5 (the baseline 5e-6 cannot train a fresh projection)
#
# Arm-specific: both dual-layer and upscale 4
model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: 'data/outputs/abl_d_u4_dual'

# GPU 0 is shared with an unrelated tensorrt-llm job that pins it at ~99%,
# which stalls every DDP step at the reducer barrier. GPU 5/6 are exclusive.
gpus: [4]
resume: true
resume_weights_only: true
resume_path: 'data/warmstart/moonvit_u2_single_ep77.pt'
resume_exclude_prefixes: ['locate_feat_replacer.']

train_or_test: train

train:
    dataset: 'SagittalPseudo3DTrain'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 5e-5
    milestones: (80, 120)
    gamma: 0.5
    # Effective global batch: 2 GPUs * 64 samples * 1 step = 128.
    # Measured peak: batch 16 -> 10.7 GB, batch 32 -> 17.0 GB on a 47 GB card.
    batch_size: 48
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 200
    drop_last: true

    epoch: 12
    num_workers: 8
    save_ep: 4

test:
    dataset: 'SagittalPseudo3DVal'
    batch_size: 1
    epoch: -1

# === Image input: pure 2D (center slice replicated into 3 channels, no neighbors) ===
pseudo3d_input_mode: 'center_repeat'
pseudo3d_mean: 0.0
pseudo3d_std: 1.0
pseudo3d_color_aug: false
pseudo3d_lr_flip: false
pseudo3d_random_crop: false

# === Heatmap ResNet detector (replaces YOLO) ===
detector_backend: 'heatmap_resnet'
heatmap_backbone: 'resnet34'
heatmap_pretrained: false
heatmap_feat_channels: 256

# === MoonViT frozen feature replacement ===
# Cache layout: data/sagittal_moonvit_cache/{training|validation}/{case_id}/x{slice_idx:04d}.npz
# Fusion: center_only (layer_18 + layer_26 concatenated, no neighbor) -> 2304-dim input to LocateFeatReplacer
# Output: 256-dim, matching dit_state_dim.
locate_feat_inject: false
locate_feat_replace: true
locate_feat_cache_root: 'data/sagittal_moonvit_cache'
locate_feat_keys: ['layer_18', 'layer_26']
locate_feat_dim: 2304
locate_feat_fusion_mode: 'center_only'
sagittal_moonvit_fusion_mode: 'center_only'
sagittal_moonvit_feature_key: 'layer_18,layer_26'
locate_feat_replace_hidden_dim: 512
locate_feat_replace_out_channels: 256
snake_feature_dim: 256
locate_feat_replace_upscale: 4

# Prev-contour init: with this probability, an instance's Snake init comes from
# the adjacent slice's GT contour (same class, same-transform) instead of the
# bbox octagon. Falls back to octagon when no matching class in the neighbor.
prev_contour_init_prob: 0.3

use_nms_for_snake: true
det_conf_thresh: 0.10
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
# Channel 0 is reserved; dataset labels are 1..25 while model classes are 0..24.
heatmap_class_offset: 1
use_gt_det: true
use_gt_det_train_only: true
gt_detection_class_offset: 1
freeze_snake: false
freeze_heatmap_detector: true
skip_heatmap_detector_when_gt: true

loss_scales: {det: 0.0, diff: 1.0, prior: 0.0, smooth: 0.0, curv: 0.0}

use_diffusion_evolution: true
use_flow_matching: true
flow_2d_s_conditioning: true
flow_ode_steps: 5
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
# Reuse existing sagittal displacement stats (same octagon initialization).
diffusion_disp_stats: 'data/stats/sagittal_2d_pseudo3d_disp_stats.json'

use_dit_v3: true
use_dit_v4_1: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: true
iterative_num_steps: 5
iterative_fractions: [0.3333, 0.5, 0.80, 0.97, 1.0]
iterative_ode_steps: 20

infer_noise_scale: 1.0
infer_avg_samples: 1

use_grpo: false
heads: {'ct_hm': 26, 'wh': 2}
yolo_num_classes: 26
segm_or_bbox: 'segm'
use_diffusion_trainer: true

# V4.1 flags — detail_context and p3 disabled (MoonViT covers that role)
v4_1_use_p3_features: false
v4_1_use_detail_context: false
v4_1_use_per_point_delta: false
v4_1_use_curvature_reweight: false
v4_1_small_disp_prob: 0.25
v4_1_small_disp_min_frac: 0.80
v4_1_small_disp_max_frac: 0.95

# V4.6c MoE head
v4_1_final_head_type: 'moe'
v4_6_moe_num_experts: 8
v4_6_moe_top_k: 2
v4_6_moe_balance_weight: 0.001
v4_6_moe_expert_init_std: 0.0001
v4_6_moe_router_noise_std: 0.01
v4_6_moe_use_point_embed: true
v4_6_moe_use_cyclic_router: true
v4_6_moe_use_shared_expert: true
v4_6_moe_routed_expert_scale: 1.0
v4_6_moe_expert_type: 'mlp'
v4_6_moe_expert_hidden_dim: 256

# V4.9 rich-state sampling
v4_9_use_rich_state_sampling: true
v4_9_use_rich_infer_schedule: true
v4_9_infer_target_fractions: [0.3333, 0.5, 0.80, 0.97, 1.0]
v4_9_continuous_state_prob: 0.15
v4_9_discrete_state_prob: 0.40
v4_9_discrete_fractions: [0.3333, 0.5, 1.0]
v4_9_small_state_prob: 0.25
v4_9_hard_far_state_prob: 0.05
v4_9_near_zero_state_prob: 0.15
v4_9_continuous_min_frac: 0.05
v4_9_continuous_max_frac: 0.85
v4_9_hard_far_min_frac: 0.0
v4_9_hard_far_max_frac: 0.20
v4_9_near_zero_min_frac: 0.97
v4_9_near_zero_max_frac: 0.999

dataloader_persistent_workers: true
dataloader_prefetch_factor: 4

# Some detector/diffusion branches are conditional, so DDP must account for
# parameters that are not touched on every batch to avoid reducer deadlocks.
ddp_find_unused_parameters: false
ddp_gradient_as_bucket_view: true
ddp_bucket_cap_mb: 50
use_amp: true
# PyTorch 1.11 + CUDA 11.3 lacks BF16 bilinear upsampling; FP16 is supported
# by the same kernels and is protected by GradScaler.
amp_dtype: 'float16'
enable_tf32: true
cudnn_benchmark: true
# The GT-decode leak is fixed; retaining the allocator cache avoids repeated
# cudaMalloc synchronization while remaining well below the 48 GB limit.
cuda_empty_cache_interval: 0
