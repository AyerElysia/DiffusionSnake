# V3.9 single-sample overfit config
# Generalization-first variant:
# - Keep the shared-head V3.6 backbone
# - Train with non-zero flow noise to avoid pure memorization
# - Use multi-step iterative refinement at inference
# - Keep only mild final smoothing

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_diffusion_dit_v3_9_single_overfit"

gpus: [0]
resume: false

train_or_test: train

train:
    dataset: 'BtcvMini'
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    per_contour: false

    optim: 'adamw'
    lr: 5e-5
    milestones: (3000, 6000, 8000)
    gamma: 0.5
    batch_size: 1
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.02
    warmup_steps: 200

    epoch: 10000
    num_workers: 0
    save_ep: 100

test:
    dataset: 'BtcvMini'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_single_overfit'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 12
flow_noise_scale: 0.5
flow_train_noise_scale: 0.5
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

# Shared-head Flow backbone from V3.6
use_dit_v3_6: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

# Keep iterative refinement but avoid deterministic one-step shortcuts
use_iterative_refinement: true
iterative_num_steps: 3
iterative_fractions: [0.3333, 0.5, 1.0]

# Mild final smoothing only
fourier_smooth_k: 8

use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true
