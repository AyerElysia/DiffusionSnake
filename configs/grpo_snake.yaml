    "2": L5 vertebral body. In some images, presents as an approximately rounded rectangle, located superior to S1 and inferior to L4 (more precisely, superior to the S1/L5 intervertebral disc and inferior to the L5/L4 intervertebral disc). The spinous process is situated to the right of the vertebral body, extending posteroinferiorly (inferiorly and to the right in the image) as a plate-like structure. In some images, the vertebral body shape becomes irregular; the spinous process may also adopt an approximately elliptical form. In some images, the spinous process and vertebral body may appear conjoined, presenting an irregular shape. Both the L5 vertebral body and its corresponding spinous process are designated as label 2.
