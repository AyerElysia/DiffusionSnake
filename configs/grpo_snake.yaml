max_length: 64
text: 'The provided MRI image is a sagittal view of the spine showcasing key anatomical structures relevant for segmentation. \
    Below is a concise academic description of the critical tissues: This MRI dataset delineates the spinal column from S1 to C1, \
    with each vertebral body and intervertebral disc assigned a unique label. The vertebral bodies generally present as rounded rectangles \
    in the midsagittal plane, with their spinous processes located to the right. As images move away from the midline, the shapes of both \
    vertebral bodies and spinous processes become more irregular. The spinous processes exhibit varying lengths and degrees of bifurcation, \
    with those of the cervical vertebrae being notably shorter and more prone to division. The intervertebral discs are consistently positioned \
    between adjacent vertebral bodies and appear elliptical in the midsagittal plane, though their shapes can become irregular in other sagittal \
    planes. C2 is characterized by its tall triangular shape and bifurcated spinous process, while C1 is distinguished by its small circular form.'

