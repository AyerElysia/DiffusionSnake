model: 'sbd'
network: 'ro_34'
task: 'snake'
resume: true
gpus: [0,1,2,3,4,5,6,7]
multistage: False
add_darnet: 0
train_or_test: train
random_num: 0

# 扩散预训练开关
use_grpo: false
grpo_first_contour_only: true
grpo_window_size: 1
grpo_window_range: [15, 20]

# 预训练/权重
# origin network：model_dir: "E:\\PyCharm-ZRC\\PyCharm-Project\\DeepSnake_remove_c\\data\\model\\MultipleSeg_1206_deepsnake_woDCNv2"
# two heads network：model_dir: "E:/PyCharm-ZRC/PyCharm-Project/DeepSnake_remove_c/data/model/test_darnet/"
# two heads network for new data:
# model_dir: "/mnt/sdb1/leijh/EnergySnake1/EnergeSnake/data/model/LJH/new_230/230or_ce"
# model_dir: "/mnt/sdb1/leijh/EnergySnake1/EnergeSnake1/data/model/cmam"
model_dir: "/mnt/sdb1/leijh/EnergySnake1/EnergeSnake1/data/model/cmam"
# model_initial_root: "/mnt/sdb1/leijh/EnergySnake1/EnergeSnake/data/model/initial_pth/dla34-ba72cf86.pth"
# model_clinical_bert: "/mnt/sdb1/leijh/EnergySnake1/EnergeSnake/lib/networks/clinical_bert/main_cb"
yolo_pretrained: "/mnt/sdb1/leijh/EnergySnake1/yolov8n.pt"
freeze_snake: False
freeze_yolo: False

train:
    beta: 0           # KL 系数，>0 则启用 KL
    #clip_range: 0.2  # PPO 裁剪窗口 ε
    clip_range: 0.001 # PPO 裁剪窗口 ε
    adv_clip_max: 5.0 # A 的裁剪上限（数值稳定）

    per_contour: false

    optim: 'adamw'
    lr: 1e-4
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 96
    dataset: 'CocoTrain'
    num_workers: 0
    epoch: 1000
    data_path: '/home/medteam/Zhrch/COCO'
    save_ep: 1
    visual_save_root: '/mnt/sdb1/leijh/EnergySnake1/EnergeSnake1/lib/ljh_visual/8_28_train'

# 多任务损失权重（用于匹配数量级）
loss_scales: {det: 0, ex: 1.0, py: 1.2}

test:
    dataset: 'CocoVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/COCO/val2017'
    epoch: 499
    visual_save_root: '/mnt/sdb1/leijh/EnergySnake1/EnergeSnake1/visual/cmam1'

# YOLO -> Snake 初始化的后处理（训练与测试保持一致）
use_nms_for_snake: true
det_conf_thresh: 0.01  # 置信度阈值
det_iou_thresh: 0.45   # NMS IoU 阈值
det_max_det: 100       # 每张图最多保留的检测数
per_class_nms: true    # 是否按类别做 NMS（true：类内 NMS；false：类无关 NMS）

# 是否在训练/测试中用 GT 框替换预测框进行蛇初始化（消融用）
use_gt_det: false

# Diffusion Evolution 配置（预训练默认开启）
use_diffusion_evolution: true
diffusion_timesteps: 1000
use_ddim_inference: true
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'  # 'basic', 'adaptive', or 'multiscale'

heads: {'ct_hm':81, 'wh': 2}
segm_or_bbox: 'segm'

