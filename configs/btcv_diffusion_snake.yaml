model: 'sbd'
network: 'ro_34'
task: 'snake'
resume: true
gpus: [2,5]
multistage: False
add_darnet: 0
train_or_test: train
random_num: 0

use_grpo: false
grpo_first_contour_only: true
grpo_window_size: 1
grpo_window_range: [15, 20]

model_dir: "data/model/btcv_diffusion"
yolo_pretrained: ""
load_yolo_pretrained: false
freeze_snake: False
freeze_yolo: False

train:
    beta: 0
    clip_range: 0.001
    adv_clip_max: 5.0

    per_contour: false

    stage1_epoch: 400
    stage2_epoch: 600
    stage3_epoch: 900
    lr_stage1: 5.0e-5
    lr_stage2: 1.0e-6
    lr_stage3: 1.0e-8


    optim: 'adamw'
    lr: 5e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 128
    dataset: 'BtcvTrain'
    num_workers: 4
    epoch: 1000
    data_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_new_snake'
    save_ep: 10

loss_scales: {det: 0, ex: 1.0, py: 1.2}

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true

use_gt_det: false

use_diffusion_evolution: true
diffusion_timesteps: 1000
use_ddim_inference: true
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'

diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats.json"

heads: {'ct_hm':9, 'wh': 2}
segm_or_bbox: 'segm'

use_diffusion_trainer: true
