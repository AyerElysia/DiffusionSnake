# DiT V3.10 配置文件 — 基于BBox的自适应点数训练
# 核心改进: 根据bounding box动态分配点数，训练和推理一致

# ===== 模型配置 =====
model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/model/btcv_diffusion_dit_v3_10"

gpus: [6,7]
resume: true

# ===== 训练配置 =====
train_or_test: train

train:
    dataset: 'BtcvTrain'
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_new_snake'
    per_contour: false

    optim: 'adamw'
    lr: 5e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 16  # 减小batch size（因为点数变化）
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 1000

    epoch: 1000
    num_workers: 4
    save_ep: 10

# ===== 测试配置 =====
test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

# ===== 检测配置 =====
use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

# ===== V3.10 自适应点数配置 =====
adaptive_points_enabled: true
min_points: 32
max_points: 128
target_density: 2.5  # 像素/点
round_to_multiple: 8
point_strategy: 'perimeter'  # 'perimeter', 'area', 'mixed'

# ===== 损失权重 =====
loss_scales:
    det: 0
    ex: 1.0
    py: 1.2
    diff: 1.0
    iou: 0.3      # IoU损失（新增）
    curv: 0.05    # 曲率正则化（新增）

# ===== 扩散模型配置 =====
use_diffusion_evolution: true
diffusion_timesteps: 1000
use_ddim_inference: true
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

# ===== DiT V3.1 去噪器核心配置 =====
use_dit_v3: true
use_dit_v3_1: true         # 使用V3.1架构
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

# ===== 系统开关 =====
use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true
