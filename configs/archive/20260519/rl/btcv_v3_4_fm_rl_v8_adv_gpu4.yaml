# V3.4-FM RL V8 – Advantage-Weighted Multi-Rollout Distillation (GPU 4)
#
# Root-cause fixes over V5b/V6/V7:
#
# 1. LR 10× higher (5e-6 vs 5e-7): Previous runs at LR≤2e-6 produced updates
#    ~200× smaller than one effective training step, making any weight change
#    immeasurable.  At LR=5e-6, the grpo_v2_long log confirmed the model DOES
#    respond to gradients (eval_iou shifted by 0.035 in 80 steps).
#
# 2. adv_distill=1 – Advantage-Weighted Distillation (new code path in
#    grpo_train_v2.py):
#    Instead of distilling only the best-of-K trajectory, we use ALL K rollouts
#    that have positive advantage, each weighted by its normalised advantage.
#    This provides ~K/2 independent gradient targets per step versus 1, giving
#    a substantially stronger and more consistent learning signal.
#
# 3. distill_compare_det=0 / delta gate: the det-comparison gate adds extra
#    rollout overhead and can silently suppress all distillation updates; using
#    the simpler delta gate is more reliable.
#
# 4. distill_loss_clip=0 (no cap): actual distill_loss ≈ 0.004, well below 0.05
#    so clipping was a no-op anyway.
#
# 5. reward_w_iou=1.0, pure absolute IoU: cleaner signal for rollout ranking.
#
# GPU: 4

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_v3_4_fm_rl_v8_adv_gpu4"

gpus: [4]
resume: false
resume_weights_only: true
resume_path: "data/outputs/btcv_diffusion_dit_v3_4_fm_full_noleak_yolom_gpu35_reusemax/checkpoints/latest.pt"

train_or_test: train

train:
    dataset: 'BtcvTrain'
    data_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_new_snake'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 5.0e-6
    milestones: (2000, 4000)
    gamma: 0.5
    batch_size: 1
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.0
    warmup_steps: 0
    beta: 0.04
    clip_range: 0.2
    adv_clip_max: 2.0

    epoch: 1000
    num_workers: 2
    save_ep: 100
    save_every: 20

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_diffusion_trainer: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

use_dit_v3: true
use_dit_v3_4: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: true
iterative_num_steps: 3
iterative_fractions: [0.3333, 0.5, 1.0]
iterative_ode_steps: 20

infer_noise_scale: 1.0
infer_avg_samples: 1

use_grpo: true
grpo_pure_rl_loss: true
grpo_first_contour_only: false
grpo_steps: 20

freeze_yolo: true
freeze_snake: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'

yolo_model_scale: 'm'
dataloader_persistent_workers: true
dataloader_prefetch_factor: 4

# ---- RL-V8 hyperparameters ----
grpo_v2_train_steps: 300
grpo_v2_rollout_source: 'manual_gt_init'
grpo_v2_rollout_iterative: true
grpo_v2_eval_batches: 8
grpo_v2_k: 16
grpo_v2_rollout_steps: 10
grpo_v2_window_size: 0
grpo_v2_window_range: [0, 10]
grpo_v2_action_std: 0.0
grpo_v2_action_std_min: 0.0
grpo_v2_action_std_decay: 1.0

# PPO lightweight (log_prob=0 at action_std=0, so only distillation matters)
grpo_v2_ppo_inner_epochs: 1
grpo_v2_ppo_clip: 0.10
grpo_v2_ppo_kl_target: 0.005
grpo_v2_kl_beta: 0.0
grpo_v2_adv_clip_max: 2.0
grpo_v2_gate_margin: 0.001

# Pure absolute IoU reward – cleanest signal for rollout ranking
grpo_v2_reward_abs_weight: 1.0
grpo_v2_reward_delta_weight: 0.0
grpo_v2_reward_w_region: 0.0
grpo_v2_reward_w_dice: 0.0
grpo_v2_reward_w_iou: 1.0

# Distillation: advantage-weighted multi-rollout mode
grpo_v2_adv_distill: 1
grpo_v2_distill_weight: 2.0
grpo_v2_distill_compare_det: 0
grpo_v2_distill_det_margin: 0.002
grpo_v2_distill_min_delta: 0.003
grpo_v2_distill_loss_clip: 0.0

grpo_v2_ema_decay: 0.99
grpo_v2_grad_clip_norm: 0.5
grpo_v2_eval_every: 10
grpo_v2_viz_every: 200
grpo_v2_save_every: 20
grpo_v2_log_every: 1
grpo_v2_seed: 20260519
grpo_v2_lr: 5.0e-6
