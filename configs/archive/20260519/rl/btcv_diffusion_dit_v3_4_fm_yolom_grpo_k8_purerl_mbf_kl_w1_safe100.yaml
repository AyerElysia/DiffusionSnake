# V3.4-FM YOLO-m GRPO post-training: 100-step conservative k=8 pure RL, mBoundF reward, late window, small KL.

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_diffusion_dit_v3_4_fm_yolom_grpo_k8_purerl_mbf_kl_w1_safe100"

gpus: [1]
resume: false
resume_weights_only: true
resume_path: "data/outputs/btcv_diffusion_dit_v3_4_fm_full_noleak_yolom_gpu35_reusemax/checkpoints/latest.pt"

train_or_test: train

train:
    dataset: 'BtcvTrain'
    data_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_new_snake'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 1e-7
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 4
    gradient_accumulation_steps: 2
    gradient_clip: 1.0
    weight_decay: 0.0
    warmup_steps: 0
    beta: 0.01
    clip_range: 0.1
    adv_clip_max: 3.0

    epoch: 1000
    num_workers: 4
    save_ep: 50
    save_every: 25

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_diffusion_trainer: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

use_dit_v3: true
use_dit_v3_4: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: true
iterative_num_steps: 3
iterative_fractions: [0.3333, 0.5, 1.0]
iterative_ode_steps: 20

infer_noise_scale: 1.0
infer_avg_samples: 1

use_grpo: true
grpo_pure_rl_loss: true
grpo_first_contour_only: false
grpo_train_steps: 100
grpo_seed: 20260510
grpo_steps: 20
grpo_k: 8
grpo_window_size: 1
grpo_window_range: [15, 19]
grpo_loss_weight: 0.1
grpo_action_std: 0.1
grpo_normalize_adv: true
grpo_reward_image_scale: true
grpo_reward_delta: true
grpo_adv_center: 'group'
reward_w_region: 1.0
reward_w_dice: 0.0
reward_w_iou: 0.0

freeze_yolo: true
freeze_snake: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'

yolo_model_scale: 'm'
dataloader_persistent_workers: true
dataloader_prefetch_factor: 4
