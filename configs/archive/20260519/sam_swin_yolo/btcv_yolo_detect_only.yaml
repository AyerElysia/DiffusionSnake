model: 'sbd'
network: 'ro_34'
task: 'snake'
resume: true
gpus: [3]
multistage: false
train_or_test: train
random_num: 0

model_dir: "data/model/btcv_yolo_detect_only"
yolo_pretrained: "data/pretrained/yolov8n.pt"
load_yolo_pretrained: true
yolo_num_classes: 8
yolo_train_scope: full
disable_lr_flip: true
freeze_snake: true
freeze_yolo: false

train:
    per_contour: false
    optim: 'adamw'
    lr: 3e-4
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 8
    dataset: 'BtcvTrain'
    num_workers: 4
    epoch: 100
    data_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_new_snake'
    save_ep: 10

loss_scales: {det: 1.0, ex: 0.0, py: 0.0}

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

use_diffusion_evolution: false
use_diffusion_trainer: false

heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
