# V5.2 stability verification: 100 epochs in an isolated output directory.
# It loads the current V5.2 weights, but does not overwrite the main V5.2 run.

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_diffusion_dit_v5_2_samsnake_fm_gtbox_stability100"

gpus: [0, 1, 3, 5]
resume: true
resume_weights_only: true
resume_path: "data/outputs/btcv_diffusion_dit_v5_2_samsnake_fm_gtbox/checkpoints/latest.pt"
freeze_yolo: true

train_or_test: train

train:
    dataset: 'BtcvTrain'
    data_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_new_snake'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 3e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 2
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 1000

    epoch: 100
    num_workers: 8
    save_ep: 5

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

detector_backend: 'samsnake_fm'
samsnake_dla_pretrained: false
samsnake_use_dcn: false
samsnake_dla_last_level: 5
samsnake_freeze_dla: true
v5_2_use_samsnake_refine: true
samsnake_refine_stride: 4.0
samsnake_refine_zero_init: true
samsnake_refine_max_disp_frac: 0.20
samsnake_refine_ignore: false

use_nms_for_snake: true
det_conf_thresh: 0.05
det_iou_thresh: 0.45
det_max_det: 9
per_class_nms: true
use_gt_det: true

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false
fm_max_disp_frac: 0.25

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

use_dit_v3: true
use_dit_v4_1: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: true
iterative_num_steps: 3
iterative_fractions: [0.3333, 0.5, 1.0]
iterative_ode_steps: 20

infer_noise_scale: 1.0
infer_avg_samples: 1

use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true

v4_1_use_p3_features: false
v4_1_use_detail_context: true
v4_1_detail_context_mode: 'normal'
v4_1_use_per_point_delta: true
v4_1_per_point_delta_scale: 0.10
v4_1_per_point_delta_reg_weight: 0.0002
v4_1_use_curvature_reweight: true
v4_1_curvature_loss_weight: 1.5
v4_1_curvature_reweight_power: 1.0
v4_1_small_disp_prob: 0.10
v4_1_small_disp_min_frac: 0.80
v4_1_small_disp_max_frac: 0.95

contour_init_method: 'efficient_sam'
sam_backend: 'efficient_sam'
sam_weight: "data/pretrained/efficient_sam_vitt.pt"
efficient_sam_weight: "data/pretrained/efficient_sam_vitt.pt"
efficient_sam_encoder_dim: 192
efficient_sam_encoder_heads: 3
efficient_sam_bgr_to_rgb: true
efficient_sam_multimask_select: 'area'
sam_prompt_source: 'gt_box'
sam_train_prompt_source: 'gt_box'
sam_train_match_iou_min: 0.10
sam_train_det_score_thresh: 0.0001
sam_det_score_thresh: 0.0001
sam_min_mask_area: 16
sam_fallback: 'octagon'
sam_use_in_train: true
efficient_sam_empty_cache_after_predict: true

eval_use_network_forward: true
dataloader_persistent_workers: true
dataloader_prefetch_factor: 4
