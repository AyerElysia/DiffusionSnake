# V3.4-FM evaluation with GT-bbox SAM initialization.
# Pipeline: GT bbox -> SAM contour -> V3.4-FM multi-step refinement.

model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/outputs/btcv_diffusion_dit_v3_4_fm_full_noleak_yolom_gpu35_reusemax"

gpus: [2]
resume: true
resume_weights_only: true
resume_path: "data/outputs/btcv_diffusion_dit_v3_4_fm_full_noleak_yolom_gpu35_reusemax/checkpoints/latest.pt"

train_or_test: test

train:
    dataset: 'BtcvTrain'
    data_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_new_snake'
    per_contour: false
    merge_with_val: false

    optim: 'adamw'
    lr: 5e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 24
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 1000

    epoch: 10000
    num_workers: 8
    save_ep: 50

test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/home/medteam/Zhrch/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: true

loss_scales: {det: 0, ex: 1.0, py: 1.2}

use_diffusion_evolution: true
use_flow_matching: true
flow_ode_steps: 10
flow_noise_scale: 1.0
flow_train_noise_scale: 1.0
flow_fix_t0: false

diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats_octagon.json"

use_dit_v3: true
use_dit_v3_4: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

use_iterative_refinement: true
iterative_num_steps: 3
iterative_fractions: [0.3333, 0.5, 1.0]
iterative_ode_steps: 20

infer_noise_scale: 1.0
infer_avg_samples: 1

use_grpo: false
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true

yolo_model_scale: 'm'

contour_init_method: 'sam'
sam_backend: 'sam'
sam_weight: "data/pretrained/sam_b.pt"
sam_allow_download: false
sam_imgsz: 1024
sam_prompt_source: 'gt_box'
sam_min_mask_area: 16
sam_fallback: 'octagon'

dataloader_persistent_workers: true
dataloader_prefetch_factor: 4
