# DiT 测试配置 - 单卡、低学习率、独立输出目录
# 用于验证学习率是否过大

# ===== 模型配置 =====
model: 'sbd'
network: 'ro_34'
task: 'snake'
model_dir: "data/model/btcv_diffusion_dit_lr_test"

gpus: [1]          # 只用 1 张卡
resume: false      # 从头开始

# ===== 训练配置 =====
train_or_test: train

train:
    # 基础配置
    dataset: 'BtcvTrain'
    data_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_new_snake'
    per_contour: false

    # 训练超参数（保守设置）
    optim: 'adamw'
    lr: 5e-6                    # 降低学习率：5e-5 -> 1e-5
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 64              # 降低 batch size：64 -> 16 (单卡)
    gradient_accumulation_steps: 1  # 梯度累积，等效 batch_size = 16 * 4 = 64
    gradient_clip: 0.5          # 更激进的梯度裁剪：1.0 -> 0.5
    weight_decay: 0.01
    warmup_steps: 500           # 减少 warmup：1000 -> 500

    # 训练设置
    epoch: 1000
    num_workers: 4
    save_ep: 10

# ===== 测试配置 =====
test:
    dataset: 'BtcvVal'
    batch_size: 1
    img_path: '/mnt/sdb1/leijh/DiffusionSnake/Datasets/BTCV/btcv_png_test_new_snake'
    epoch: -1

# ===== 检测配置 =====
use_nms_for_snake: true
det_conf_thresh: 0.01
det_iou_thresh: 0.45
det_max_det: 100
per_class_nms: true
use_gt_det: false

# ===== 损失权重 =====
loss_scales: {det: 0, ex: 1.0, py: 1.2}

# ===== 扩散模型配置 =====
use_diffusion_evolution: true
diffusion_timesteps: 1000
use_ddim_inference: true
diffusion_loss_weight: 1.0
diffusion_loss_type: 'adaptive'
diffusion_disp_norm: true
diffusion_disp_stats: "data/stats/btcv_disp_stats.json"

# ===== DiT 去噪器配置 =====
use_dit_denoiser: true
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256

# ===== GRPO 配置 =====
use_grpo: false

# ===== 其他配置 =====
heads: {'ct_hm': 9, 'wh': 2}
segm_or_bbox: 'segm'
use_diffusion_trainer: true
